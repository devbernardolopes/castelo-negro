# [shake]The[/shake] [blink]time[/blink] [wiggle]has[/wiggle] [shrink]arrived...[/shrink]
# This string `>>>>` (four `>` without the backticks) makes the game pause until a key is pressed
# This string `---page---` (without the backticks) denotes a new page (block of text) when the player is reading in-game

strings:

  # `intro` is the text that is presented to the player whenever the game starts.
  intro:
    en: |
      This is where your adventure begins, which is perhaps the most damning thing that can be said about it.

      You are standing on the doorstep of your cottage — a modest structure that has never been accused of architectural ambition. The door behind you hangs slightly crooked, a problem you have been meaning to fix for three years. The morning sun has the cheerful indifference of a thing that has never gambled and lost seventeen gold pieces to a man named Brom.

      Your neighbor Gerald is tending his vegetable patch across the lane. He waves. He always waves. It is unclear if Gerald is aware that anything in the world is ever wrong.

      The road north leads out of the village toward the hills. You are wearing your leather satchel and carrying a sword. You bought the sword secondhand. The previous owner sold it because it was, and this is a direct quote, [i]"not very good."[/i]

  book_adventurers_journal:
    en: |
      [grow][b]FIELD NOTES — PERSONAL[/b][/grow]
      By Edvard Crestmore, Adventurer (Freelance)
      ---page---
      Day 1. Set out from Millhaven at dawn. Weather: adequate. Packed: sword, rations,
      this journal, a lucky coin I found in the gutter which T. insists is not lucky.
      T. is not coming on this expedition. T. cited "basic survival instincts" as the reason.
      ---page---
      Day 3. Passed through Aldenmere. Bought bread. The baker asked where I was headed.
      I said "the hills." He said "which hills." I said "the ones with the dragon."
      He gave me the bread for free. I chose to interpret this as respect.
      ---page---
      Day 4. Traveling bread recipe (from baker, who I now believe was being kind):
      Mix flour, water, salt. No yeast — it won't keep. Bake flat on a hot stone.
      Result: edible. Barely. T. would say this describes my cooking generally.
      T. is not here.
      ---page---
      Day 5. Long argument with T. (by letter, which I sent from Aldenmere and received
      a reply to already, which says something about T.'s feelings on the matter)
      re: bedroll packing. T. maintains the roll goes outside the pack, for ventilation.
      I maintain it goes inside, for protection. We are at an impasse. We have been at
      this impasse for three years.
      ---page---
      Day 6. Found the cave. The sign says NO SOLICITING.
      I am not soliciting. I am retrieving.
      There is a difference. I am fairly confident there is a difference.
      Going in. Probably fine.
      ---page---
      [blink][i]"Found cave. Going in. Probably fine."[/i][/blink]