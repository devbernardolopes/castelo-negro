# conditional_messages are evaluated before effects
# conditional_messages only runs on action failure
# progressive_messages are evaluated after effects

# effect: "setImageFilter('brightness', 0)"                                           # complete darkness
# effect: "setImageFilter('brightness', 0.3)" followed by "setImageFilter('blur', 2)" # severe impairment
# effect: "setImageFilter('opacity', 0.5)"                                            # partial transparency
# effect: "setImageFilter('none')"                                                    # restore normal vision

# Usage examples
#
# # Setting filter components in effects
# effect: "setImageFilter('brightness', 0.3)"
# effect: "setImageFilter('blur', 4)"
# effect: "setImageFilter('opacity', 0.5)"
#
# # Using variables as values
# effect: "setImageFilter('brightness', brightness_step)"
# effect: "setImageFilter('brightness', getImageFilter('brightness') - brightness_step)"
#
# # Resetting all filters
# effect: "setImageFilter('none')"
#
# # Checking filters in conditions
# conditions:
#   - "getImageFilter('brightness') < 0.5"
#   - "getImageFilter('blur') >= 2"
#
# # Using the raw object in conditions (alternative form)
# conditions:
#   - "image_filter.brightness < 0.5"
#
# # Float variable
# variables:
#   blindness_level:
#     type: float
#     value: 0.0
#
# # Using float in conditions
# conditions:
#   - "blindness_level > 0.5"

actions:
  # -------------------------------
  # Specific actions - All actions that are specific to this game must go here.
  # -------------------------------
  examine_while_blind_with_dog:
    pattern:
      - verb: ["examine"]
      - object: ["*"]
        optional: true
    conditions:
      - "getActorProp(current_player_actor, 'can_see') != true"
      - "pet_dog_count + talk_dog_count >= dog_friendship_threshold"  # threshold for "befriended"
    message:
      en: |
        You can't see anything, but the dog nudges your hand toward the {object_name}.
        You get a rough tactile impression. It doesn't help much.

  examine_while_blind:
    pattern:
      - verb: ["examine"]
      - object: ["*"]
        optional: true
    conditions:
      - "getActorProp(current_player_actor, 'can_see') != true"
    message:
      en: |
        You [b]can't[/b] see a thing! You're [wiggle]blind[/wiggle] from looking at the sun. Did you forget?
      pt-br: |
        Você [b]não[/b] pode ver nada! Você está [wiggle]cego[/wiggle] por conta de olhar para o sol. Você esqueceu?

  look_at_the_town:
    pattern:
      - verb: ["look"]
      - object: [town_misnomer]
    conditions:
      - "current_location in ['cottage_doorstep', 'old_crossroads', 'hillside_path']"
    effect:
      - "look_at_the_town_count += 1"
    message:
      en: |
        Town? You mean [i]village[/i], surely. A town houses five thousand to a hundred thousand people and serves as a regional hub. This place has a tavern, a well, and Gerald. It is a village.

  look_at_the_city:
    pattern:
      - verb: ["look"]
      - object: [city_misnomer]
    conditions:
      - "current_location in ['cottage_doorstep', 'old_crossroads', 'hillside_path']"
    effect:
      - "look_at_the_city_count += 1"
    message:
      en: |
        City? You mean village, right? Because cities are densely populated centers with over 100,000 residents, often numbering in the millions.

  look_at_the_sun:
    pattern:
      - verb: ["look"]
      - object: [morning_sun]
    conditions:
      - "look_at_the_sun_count < look_at_the_sun_threshold"
      - "current_location in ['cottage_doorstep', 'old_crossroads', 'hillside_path']"
    effect:
      - "look_at_the_sun_count += 1"
      - "setImageFilter('brightness', 1.0 + look_at_the_sun_count * brightness_step)"
      - "setImageFilter('blur', 2)"
    progressive_messages:
      - condition: "look_at_the_sun_count < look_at_the_sun_threshold"
        message:
          en: |
            You look at the morning sun. Your eyes [wiggle]protest[/wiggle].
      - condition: "look_at_the_sun_count == look_at_the_sun_threshold"
        effect:
          - "setImageFilter('brightness', 0)"
          - "setActorProp(current_player_actor, 'can_see', false)"
          - "show_location_image_inline = false"
        message:
          en: |
            Oh, great. Now you're [wiggle]blind[/wiggle].

  talk_wave_nod_to_at_gerald:
    pattern:
      - verb: ["talk", "greet", "wave", "nod"]
      - object: [neighbor_gerald]
    conditions:
      - "here.has('{object}')"
    effect:
      - "talk_gerald_count += 1"
    progressive_messages:
      - condition: "talk_gerald_count == 1"
        message:
          en: |
            You wave at Gerald. Gerald waves back. Gerald always waves back.
      - condition: "talk_gerald_count == 2"
        message:
          en: |
            You wave again. Gerald waves again. He seems genuinely pleased about this.
      - condition: "talk_gerald_count == 3"
        message:
          en: |
            Gerald waves with both hands this time. You're not sure when this escalated.
      - condition: "talk_gerald_count >= 4"
        message:
          en: |
            Gerald waves. You wave. This is your relationship and it will never be anything else.

  talk_to_dog:
    pattern:
      - verb: ["talk"]
      - object: [stray_dog]
    conditions:
      - "here.has('{object}')"
    effect:
      - "talk_dog_count += 1"
    progressive_messages:
      - condition: "pet_dog_count + talk_dog_count < dog_friendship_threshold"
        message:
          en: |
            [pulse]"Woof woof?"[/pulse]
      - condition: "pet_dog_count + talk_dog_count >= dog_friendship_threshold"
        effect:
          - "dog_is_following = true"
          - "removeItemFromAllLocations('stray_dog')"
          - "here.add('stray_dog')"
        message:
          en: |
            [pulse][wiggle]"Yip, yap ♥."[/wiggle][/pulse]

  pet_dog:
    pattern:
      - verb: ["pet"]
      - object: [stray_dog]
    conditions:
      - "here.has('{object}')"
    effect:
      - "pet_dog_count += 1"
    progressive_messages:
      - condition: "pet_dog_count + talk_dog_count < dog_friendship_threshold"
        message:
          en: |
            [wiggle]"Arf, arf!"[/wiggle]
      - condition: "pet_dog_count + talk_dog_count >= dog_friendship_threshold"
        effect:
          - "dog_is_following = true"
          - "removeItemFromAllLocations('stray_dog')"
          - "here.add('stray_dog')"
        message:
          en: |
            [pulse][wiggle]"Yap, yip ♥."[/wiggle][/pulse]

  eat_dog:
    pattern:
      - verb: ["eat"]
      - object: [stray_dog]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        The dog looks at you. You look at the dog. The dog continues to look at you with the patient, unblinking confidence of a creature that knows this isn't going to happen. It isn't going to happen.

  kick_dog:
    pattern:
      - verb: ["kick"]
      - object: [stray_dog]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        You [b]DON'T[/b] kick the dog.
        The narrator has strong feelings about this and will not elaborate further.

  pet_dragon:
    pattern:
      - verb: ["pet"]
      - object: [vermithrax]
    conditions:
      - "here.has('{object}')"
    effect:
      - "pet_dragon_count += 1"
    progressive_messages:
      - condition: "pet_dragon_count == 1"
        message:
          en: |
            You reach out and pat Vermithrax on the snout. There is a long pause. "That," he says, "was a choice."
      - condition: "pet_dragon_count == 2"
        message:
          en: |
            You do it again. Vermithrax closes his eye slowly, then opens it again. "I'm adding this to the appointment notes," he says. "Under [i]miscellaneous.[/i]"
      - condition: "pet_dragon_count >= 3"
        message:
          en: |
            Vermithrax says nothing this time. He simply looks at you. The look contains multitudes.

  move_loose_rock:
    pattern:
      - verb: ["push", "move"]
      - object: [loose_rock_north_wall]
    conditions:
      - "here.has('{object}')"
      - "!loose_rock_moved"
    effect:
      - "loose_rock_moved = true"
    message:
      en: |
        You lean into the rock and push. It grinds sideways with a sound like the mountain clearing its throat, revealing a narrow passage behind it. Vermithrax does not react. Either he didn't notice, or he noticed and is choosing not to address it. Both options are somewhat worse than the other.
    conditional_messages:
      - condition: "loose_rock_moved"
        message:
          en: |
            You already moved the {object_name}.

  lock_cottage_door:
    pattern:
      - verb: ["lock"]
      - object: [cottage_door]
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "!items.isOpen('{object}')"
      - "!items.isLocked('{object}')"
      - "items.canOpen('{object}')"
      - "items.getProp('{object}', 'openable.side') != 'one_way' or items.getProp('{object}', 'openable.accessible_from') == null or items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
    # effect:
    #   - "setLocked('{object}', true)"
    message:
      en: |
        Why bother?
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't lock the {object_name}.
      - condition: "items.isOpen('{object}')"
        message:
          en: |
            The {object_name} is open. You need to close it first.
      - condition: "items.isLocked('{object}')"
        message:
          en: |
            The {object_name} is already locked.
      - condition: "items.getProp('{object}', 'openable.side') == 'one_way' and items.getProp('{object}', 'openable.accessible_from') != null and !items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
        message:
          en: |
            The {object_name} can only be locked from the other side.
      - condition: "!items.canOpen('{object}')"
        message:
          en: |
            You don't have the right item to lock the {object_name}.

  open_cottage_door:
    pattern:
      - verb: ["open"]
      - object: [cottage_door]
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "!items.isOpen('{object}')"
      - "!items.isLocked('{object}')"
    effect:
      - "open_cottage_door_count += 1"
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't open the {object_name}.
      - condition: "items.isOpen('{object}')"
        message:
          en: |
            The {object_name} is already open.
      - condition: "items.isLocked('{object}')"
        message:
          en: |
            The {object_name} is locked.
    progressive_messages:
      - condition: "open_cottage_door_count == 1"
        message:
          en: |
            You have no reason to open the {object_name}.
      - condition: "open_cottage_door_count >= 2 and open_cottage_door_count < 4"
        message:
          en: |
            I already told you: there's no reason to open the {object_name}.
      - condition: "open_cottage_door_count == 4"
        message:
          en: |
            [wiggle]Again?[wiggle]
      - condition: "open_cottage_door_count == 5"
        message:
          en: |
            There is [b]NOTHING[/b] inside that you'll need. [wiggle]Don't insist![/wiggle]
      - condition: "open_cottage_door_count > 5 and open_cottage_door_count < open_cottage_door_threshold"
        message:
          en: |
            Ugh! Again?! Look, this game doesn't even have the cottage's interior implemented, so stop trying.
      - condition: "open_cottage_door_count == open_cottage_door_threshold"
        effect:
          - "setOpen('{object}', true)"
        message:
          en: |
            Fine! FINE! You want this damn door open?! I will open it for you!

            After [shake]many[/shake] unjustified, unneeded attempts, you open the {object_name}.

            There. Happy now? Now, don't even try to enter the cottage because this location isn't even implemented in this game.
      - condition: "open_cottage_door_count > open_cottage_door_threshold and !items.isOpen('{object}')"
        effect:
          - "setOpen('{object}', true)"
        message:
          en: |
            You open the {object_name}.

  # ─────────────────────────────────────────────
  # TORCH SCONCE — Narrow Passage (red herrings)
  # ─────────────────────────────────────────────

  push_torch_sconce:
    pattern:
      - verb: ["push"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        You push the sconce. It is bolted firmly to the wall and does not move, rotate, click, or otherwise behave like a lever. It is, in every meaningful sense, just a sconce.

  pull_torch_sconce:
    pattern:
      - verb: ["pull"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        You pull on the sconce, fully expecting a distant grinding sound and the reveal of a hidden door. Nothing grinds. Nothing reveals. The sconce remains exactly as bolted as it was a moment ago.

  turn_torch_sconce:
    pattern:
      - verb: ["roll"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        You attempt to turn the sconce like a dial. It does not turn like a dial, because it is not a dial. It is a sconce. You knew this before you tried. You tried anyway.

  take_torch_sconce:
    pattern:
      - verb: ["take"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        It's bolted to the wall. You're a villager who owns a secondhand sword, not a master mason. The sconce stays exactly where it is.

  light_torch_sconce:
    pattern:
      - verb: ["light"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    message:
      en: |
        You'd need a torch to put in it first, and you don't have one. Even if you did, the cave walls are already glowing faintly on their own, which raises questions about whether this sconce has ever actually been necessary.

  examine_torch_sconce_closely:
    pattern:
      - verb: ["touch", "feel"]
      - object: [torch_sconce]
    conditions:
      - "here.has('{object}')"
    effect:
      - "examine_sconce_count += 1"
    progressive_messages:
      - condition: "examine_sconce_count == 1"
        message:
          en: |
            You run your hand along the ironwork, checking for hidden mechanisms, secret switches, or a suspiciously loose rivet. You find none of these things. You find a sconce.
      - condition: "examine_sconce_count == 2"
        message:
          en: |
            You check again, just to be thorough. The sconce has not changed. It remains, against all narrative convention, completely unremarkable.
      - condition: "examine_sconce_count >= 3"
        message:
          en: |
            You are now just touching a sconce repeatedly in a cave. The skeleton's empty eye sockets seem to be judging you. This may be projection.

  # -------------------------------
  # General actions - All general, not game-specific actions, that can be used universally in any game, must go here (it doesn't mean this game makes use of them all necessarily).
  # -------------------------------  
  examine:
    pattern:
      - verb: ["examine"]
      - object: ["*"]
        optional: true
    conditions:
      - "'{object}' == '' or (here.has('{object}') or inventory.has('{object}')) and items.visible('{object}') and getActorProp(current_player_actor, 'can_see')"
    effect: []
    message:
      en: |
        {location_or_object_description}
    conditional_messages:
      - condition: "!getActorProp(current_player_actor, 'can_see')"
        message:
          en: |
            Currently you can't see.
          pt-br: |
            No momento você não pode ver.
      - condition: "'{object}' != '' and !here.has('{object}') and !inventory.has('{object}')"
        message:
          en: |
            There's no [b]{object_name}[/b] here.
          pt-br: |
            Não há [b]{object_name}[/b] aqui.

  give:
    patterns:
      obj_then_target:
        - verb: ["give"]
        - object: ["*"]
          optional: true
        - actor: ["*"]
          optional: true
      target_then_obj:
        - verb: ["give"]
        - actor: ["*"]
          optional: true
        - object: ["*"]
          optional: true
    follow_up:
      object:
        en: "Give what?"
      actor:
        en: "To whom?"
    conditions:
      - "'{object}' != ''"
      - "'{actor}' != '' and getActor('{actor}') != null and '{actor}' != current_player_actor"
      - "getActor('{actor}').current_location == current_location"
      - "inventory.has('{object}')"
      - "!isWornBy(current_player_actor, '{object}')"
      - "getActor('{actor}').inventory.length < actors.{actor}.max_capacity"
    effect:
      - "inventory.remove('{object}')"
      - "actorInventoryAdd('{actor}', '{object}')"
    message:
      en: |
        You give the {object_name} to {actor_name}.
    conditional_messages:
      - condition: "'{object}' == ''"
        message:
          en: |
            Give what?
      - condition: "'{actor}' == '' or getActor('{actor}') == null"
        message:
          en: |
            There's no one here by that name.
      - condition: "'{actor}' == current_player_actor"
        message:
          en: |
            You can't give something to yourself.
      - condition: "getActor('{actor}').current_location != current_location"
        message:
          en: |
            {actor_name} isn't here.
      - condition: "isWornBy(current_player_actor, '{object}')"
        message:
          en: |
            You need to remove the {object_name} first.
      - condition: "!inventory.has('{object}')"
        message:
          en: |
            You don't have the {object_name}.
      - condition: "getActor('{actor}').inventory.length >= actors.{actor}.max_capacity"
        message:
          en: |
            {actor_name} can't hold any more items.

  open:
    pattern:
      - verb: ["open"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Open what?"
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "!items.isOpen('{object}')"
      - "!items.isLocked('{object}')"
    effect: "setOpen('{object}', true)"
    message:
      en: |
        You open the {object_name}.
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't open the {object_name}.
      - condition: "items.isOpen('{object}')"
        message:
          en: |
            The {object_name} is already open.
      - condition: "items.isLocked('{object}')"
        message:
          en: |
            The {object_name} is locked.

  close:
    pattern:
      - verb: ["close"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Close what?"
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "items.isOpen('{object}')"
    effect: "setOpen('{object}', false)"
    message:
      en: |
        You close the {object_name}.
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't close the {object_name}.
      - condition: "!items.isOpen('{object}')"
        message:
          en: |
            The {object_name} is already closed.

  unlock:
    pattern:
      - verb: ["unlock"]
      - object: ["*"]
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "items.isLocked('{object}')"
      - "items.canOpen('{object}')"
      - "items.getProp('{object}', 'openable.side') != 'one_way' or items.getProp('{object}', 'openable.accessible_from') == null or items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
    effect: "setLocked('{object}', false)"
    message:
      en: |
        You unlock the {object_name}.
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't unlock the {object_name}.
      - condition: "!items.isLocked('{object}')"
        message:
          en: |
            The {object_name} isn't locked.
      - condition: "items.getProp('{object}', 'openable.side') == 'one_way' and items.getProp('{object}', 'openable.accessible_from') != null and !items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
        message:
          en: |
            The {object_name} can only be unlocked from the other side.
      - condition: "!items.canOpen('{object}')"
        message:
          en: |
            You don't have the right item to unlock the {object_name}.

  lock:
    pattern:
      - verb: ["lock"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Lock what?"
    conditions:
      - "here.has('{object}')"
      - "items.openable('{object}')"
      - "!items.isOpen('{object}')"
      - "!items.isLocked('{object}')"
      - "items.canOpen('{object}')"
      - "items.getProp('{object}', 'openable.side') != 'one_way' or items.getProp('{object}', 'openable.accessible_from') == null or items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
    effect: "setLocked('{object}', true)"
    message:
      en: |
        You lock the {object_name}.
    conditional_messages:
      - condition: "'{object}' != '' and !here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.openable('{object}')"
        message:
          en: |
            You can't lock the {object_name}.
      - condition: "items.isOpen('{object}')"
        message:
          en: |
            The {object_name} is open. You need to close it first.
      - condition: "items.isLocked('{object}')"
        message:
          en: |
            The {object_name} is already locked.
      - condition: "items.getProp('{object}', 'openable.side') == 'one_way' and items.getProp('{object}', 'openable.accessible_from') != null and !items.getProp('{object}', 'openable.accessible_from').includes(current_location)"
        message:
          en: |
            The {object_name} can only be locked from the other side.
      - condition: "!items.canOpen('{object}')"
        message:
          en: |
            You don't have the right item to lock the {object_name}.

  examine_actor:
    pattern:
      - verb: ["examine"]
      - actor: ["*"]
    conditions:
      - "'{actor}' != '' and getActor('{actor}') != null"
      - "getActor('{actor}').current_location == current_location"
      - "!isActorHidden('{actor}')"
    message:
      en: |
        {actor_examine_output}
    conditional_messages:
      - condition: "'{actor}' == '' or getActor('{actor}') == null"
        message:
          en: |
            You don't see anyone like that here.
      - condition: "isActorHidden('{actor}')"
        message:
          en: |
            You don't see anyone like that here.
      - condition: "getActor('{actor}') != null and getActor('{actor}').current_location != current_location"
        message:
          en: |
            {actor_name} isn't here.

  drop_all:
    pattern:
      - verb: ["drop"]
      - object: ["*"]
        match_mode: "drop_all"
    conditions:
      - "'{object}' == '__drop_all__'"
      - "getActorProp(current_player_actor, 'can_drop_all') == true"
    effect:
      - "dropAllInventoryItems()"
    conditional_messages:
      - condition: "'{object}' == '__drop_all__' and getActorProp(current_player_actor, 'can_drop_all') != true"
        message:
          en: |
            You can't drop everything at once.

  drop:
    pattern:
      - verb: ["drop"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Drop what?"
    conditions:
      - "inventory.has('{object}')"
      - "items.droppable('{object}')"
    effect:
      - "inventory.remove('{object}')"
      - "here.add('{object}')"
    message:
      en: |
        You drop the {object_name}.
    conditional_messages:
      - condition: "!inventory.has('{object}')"
        message:
          en: |
            You don't have the {object_name}.
      - condition: "!items.droppable('{object}')"
        message:
          en: |
            You can't drop the {object_name}.

  remove_all:
    pattern:
      - verb: ["remove", "take off"]
      - object: ["*"]
        match_mode: "remove_all"
    conditions:
      - "'{object}' == '__remove_all__'"
      - "getActorProp(current_player_actor, 'can_remove_all') == true"
    effect:
      - "removeAllWornItems()"
    conditional_messages:
      - condition: "'{object}' == '__remove_all__' and getActorProp(current_player_actor, 'can_remove_all') != true"
        message:
          en: |
            You can't remove everything at once.

  remove:
    patterns:
      from_actor:
        - verb: ["remove", "take off"]
        - object: ["*"]
        - actor: ["*"]
      own:
        - verb: ["remove", "take off"]
        - object: ["*"]
          optional: true
    follow_up:
      object:
        en: "Remove what?"
    conditions:
      - "'{object}' != ''"
      - "'{actor}' == '' or (getActor('{actor}') != null and getActor('{actor}').current_location == current_location)"
    effect:
      - "removeWornItem('{actor}', '{object}')"
    conditional_messages:
      - condition: "'{object}' == ''"
        message:
          en: |
            Remove what?
      - condition: "'{actor}' != '' and (getActor('{actor}') == null or getActor('{actor}').current_location != current_location)"
        message:
          en: |
            There's no one like that here.
            
  wear:
    patterns:
      to_actor:
        - verb: ["wear"]
        - object: ["*"]
        - actor: ["*"]
      own:
        - verb: ["wear", "put on"]
        - object: ["*"]
          optional: true
    follow_up:
      object:
        en: "Wear what?"
    conditions:
      - "'{object}' != ''"
      - "'{actor}' == '' or (getActor('{actor}') != null and getActor('{actor}').current_location == current_location)"
    effect:
      - "addWornItem('{actor}', '{object}')"
    conditional_messages:
      - condition: "'{object}' == ''"
        message:
          en: |
            Wear what?
      - condition: "'{actor}' != '' and (getActor('{actor}') == null or getActor('{actor}').current_location != current_location)"
        message:
          en: |
            There's no one like that here.

  put:
    patterns:
      obj_then_target:
        - verb: ["put"]
        - object: ["*"]
        - target: ["*"]
      target_then_obj:
        - verb: ["put"]
        - target: ["*"]
        - object: ["*"]
    conditions:
      - "inventory.has('{object}')"
      - "'{target}' == '__location__' or here.has('{target}') or inventory.has('{target}')"
      - "'{target}' == '__location__' or items.container_capacity('{target}') != null"
      - "'{target}' == '__location__' or !items.openable('{target}') or items.isOpen('{target}')"
      - "'{object}' != '{target}'"
      - "'{target}' == '__location__' or !items.isAncestor('{object}', '{target}')"
      - "'{target}' == '__location__' or items.container_count('{target}') + items.item_size('{object}') <= items.container_capacity('{target}')"
    effect:
      - "inventory.remove('{object}')"
      - "putInTarget('{target}', '{object}')"
    message:
      en: |
        You place the {object_name} in the {target_name}.
    conditional_messages:
      - condition: "!inventory.has('{object}')"
        message:
          en: |
            You don't have the {object_name}.
      - condition: "'{target}' != '__location__' and !here.has('{target}') and !inventory.has('{target}')"
        message:
          en: |
            There's no {target_name} here.
      - condition: "'{target}' != '__location__' and items.container_capacity('{target}') == null"
        message:
          en: |
            You can't put things in the {target_name}.
      - condition: "'{target}' != '__location__' and items.openable('{target}') and !items.isOpen('{target}')"
        message:
          en: |
            The {target_name} is closed. You need to open it first.
      - condition: "'{object}' == '{target}'"
        message:
          en: |
            You can't put the {object_name} inside itself.
      - condition: "'{target}' != '__location__' and items.isAncestor('{object}', '{target}')"
        message:
          en: |
            You can't put the {object_name} there.
      - condition: "'{target}' != '__location__' and items.container_count('{target}') + items.item_size('{object}') > items.container_capacity('{target}')"
        message:
          en: |
            The {target_name} is full. You can't put anything else in it.

  take:
    pattern:
      - verb: ["take"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Take what?"
    conditions:
      - "items.takeable('{object}')"
      - "here.has('{object}')"
      - "!isWorn('{object}')"
      - "inventory.length < inventory.max_capacity"
      - "!inventory.has('{object}')"
    effect: "inventory.add('{object}')"
    message:
      en: |
        You take the {object_name}.
    conditional_messages:
      - condition: "inventory.has('{object}')"
        message:
          en: |
            You already have the {object_name}.
      - condition: "isWorn('{object}')"
        message:
          en: |
            You need to remove the {object_name} first.
      - condition: "!here.has('{object}')"
        message:
          en: |
            There's no {object_name} here.
      - condition: "!items.takeable('{object}')"
        message:
          en: |
            You can't take the {object_name}.
      - condition: "inventory.length >= inventory.max_capacity"
        message:
          en: |
            You can't carry any more items.

  talk:
    pattern:
      - verb: ["talk", "greet"]
      - actor: ["*"]
        optional: true
    follow_up:
      actor:
        en: "To whom?"
    conditions:
      - "'{actor}' != '' and getActor('{actor}') != null"
      - "'{actor}' != current_player_actor"
      - "getActor('{actor}').current_location == current_location"
    effect: "startConversation('{actor}')"
    message:
      en: ""
    conditional_messages:
      - condition: "'{actor}' == '' or getActor('{actor}') == null"
        message:
          en: |
            There's no one here by that name.
      - condition: "'{actor}' == current_player_actor"
        message:
          en: |
            You can't talk to yourself.
      - condition: "getActor('{actor}').current_location != current_location"
        message:
          en: |
            {actor_name} isn't here.

  stand:
    pattern:
      - verb: ["stand", "stand up", "get up"]
    conditions:
      - "isSeated(current_player_actor)"
    effect: "releaseActor(current_player_actor)"
    message:
      en: |
        You stand up from the {contained_by_name}.
    conditional_messages:
      - condition: "!isSeated(current_player_actor)"
        message:
          en: |
            You're already standing.

  sit:
    pattern:
      - verb: ["sit", "sit down"]
      - target: ["*"]
        optional: true
    follow_up:
      target:
        en: "Where?"      
    conditions:
      - "!isSeated(current_player_actor)"
      - "items.sittable('{target}')"
      - "here.has('{target}')"
      - "getContainerOccupantsCount('{target}') < items.actor_capacity('{target}')"
    effect: "containActor(current_player_actor, '{target}', 'seated')"
    message:
      en: |
        You sit down on the {target_name}.
    conditional_messages:
      - condition: "isSeated(current_player_actor)"
        message:
          en: |
            You're already sitting.
      - condition: "'{target}' != '' and !items.sittable('{target}')"
        message:
          en: |
            You can't sit on that.
      - condition: "'{target}' != '' and !here.has('{target}')"
        message:
          en: |
            There's no {target_name} here.
      - condition: "getContainerOccupantsCount('{target}') >= items.actor_capacity('{target}')"
        message:
          en: |
            There's no room on the {target_name}.

  lie:
    pattern:
      - verb: ["lie", "lie down"]
      - target: ["*"]
        optional: true
    follow_up:
      target:
        en: "Lie down on what?"
    conditions:
      - "getPosture(current_player_actor) != 'lying'"
      - "items.sleepable('{target}')"
      - "here.has('{target}')"
      - "getContainerOccupantsCount('{target}') < items.actor_capacity('{target}')"
    effect: "containActor(current_player_actor, '{target}', 'lying')"
    message:
      en: |
        You lie down on the {target_name}.
    conditional_messages:
      - condition: "getPosture(current_player_actor) == 'lying'"
        message:
          en: |
            You're already lying down.
      - condition: "'{target}' != '' and !items.sleepable('{target}')"
        message:
          en: |
            That's not a good place to lie down.
      - condition: "'{target}' != '' and !here.has('{target}')"
        message:
          en: |
            There's no {target_name} here.

  switch:
    pattern:
      - verb: ["switch"]
      - actor: ["*"]
        match_mode: name_only
        optional: true
    follow_up:
      actor:
        en: "Switch to whom?"
    conditions:
      - "'{actor}' != '' and getActor('{actor}') != null"
      - "'{actor}' != current_player_actor"
    effect:
      - "setPlayerActor('{actor}')"
    message:
      en: |
        You switch to playing as {actor_name}.
    conditional_messages:
      - condition: "'{actor}' == current_player_actor"
        message:
          en: |
            You're already playing as {actor_name}.

  attack:
    pattern:
      - verb: ["attack"]
      - actor: ["*"]
        optional: true
    follow_up:
      actor:
        en: "Attack whom?"
    confirmation:
      en: "Are you sure you want to attack {actor_name}?"
    conditions:
      - "'{actor}' != '' and getActor('{actor}') != null"
      - "getActor('{actor}').current_location == current_location"
      - "'{actor}' != current_player_actor"
    effect: ""
    message:
      en: |
        You attack {actor_name}!
    conditional_messages:
      - condition: "'{actor}' == '' or getActor('{actor}') == null"
        message:
          en: |
            There's no one here by that name.
      - condition: "getActor('{actor}').current_location != current_location"
        message:
          en: |
            {actor_name} isn't here.
      - condition: "'{actor}' == current_player_actor"
        message:
          en: |
            You can't attack yourself.

  enter:
    pattern:
      - verb: ["enter"]
      - target: ["*"]
        optional: true
    follow_up:
      target:
        en: "Enter what?"
    conditions:
      - "items.enterable('{target}')"
      - "here.has('{target}')"
    effect: "containActor(current_player_actor, '{target}', 'standing')"
    message:
      en: |
        You enter the {target_name}.
    conditional_messages:
      - condition: "'{target}' != '' and !items.enterable('{target}')"
        message:
          en: |
            You can't enter that.
      - condition: "'{target}' != '' and !here.has('{target}')"
        message:
          en: |
            There's no {target_name} here.

  exit:
    pattern:
      - verb: ["exit"]
    conditions:
      - "isSeated(current_player_actor)"
    effect: "releaseActor(current_player_actor)"
    message:
      en: |
        You get out.
    conditional_messages:
      - condition: "!isSeated(current_player_actor)"
        message:
          en: |
            You're not inside anything.

  read:
    pattern:
      - verb: ["read"]
      - object: ["*"]
        optional: true
    follow_up:
      object:
        en: "Read what?"
    conditions:
      - "'{object}' != ''"
      - "here.has('{object}') or inventory.has('{object}')"
      - "items.getProp('{object}', 'readable') != null"
      - "getActorProp(current_player_actor, 'can_see') == true"
      - "getActorProp(current_player_actor, 'can_read') == true"
    message:
      en: |
        {readable_text}
    conditional_messages:
      - condition: "getActorProp(current_player_actor, 'can_read') != true"
        message:
          en: "You can't read anything."
      - condition: "getActorProp(current_player_actor, 'can_see') != true"
        message:
          en: "You can't see anything."
      - condition: "'{object}' == ''"
        message:
          en: "Read what?"
      - condition: "!here.has('{object}') and !inventory.has('{object}')"
        message:
          en: "There's no {object_name} here."
      - condition: "items.getProp('{object}', 'readable') == null"
        message:
          en: "You can't read that."

  smell:
    pattern:
      - verb: ["smell"]
      - target: ["*"]
        optional: true
    follow_up:
      target:
        en: "Smell what?"
    conditions:
      - "getActorProp(current_player_actor, 'can_smell') == true"
      - "'{target}' == '__location__' or ((here.has('{target}') or inventory.has('{target}')) and items.getProp('{object}', 'smellable') != null)"
      - "'{target}' != ''"
    message:
      en: |
        {location_or_object_description}
    conditional_messages:
      - condition: "getActorProp(current_player_actor, 'can_smell') != true"
        message:
          en: "You're unable to smell anything."
      - condition: "'{target}' == ''"
        message:
          en: "Smell what?"
      - condition: "items.getProp('{target}', 'smellable') == null"
        message:
          en: "No particular odor is discernible."
      - condition: "!here.has('{target}') and !inventory.has('{target}')"
        message:
          en: "There's no {target_name} here."

  fallback_generic:
    message_pool:
      en:
        - "I don't understand what you mean."
        - "That makes no sense in this context."
        - "You're not sure how to do that here."
        - "That idea doesn't seem to lead anywhere."
        - "You can't quite figure out how to make that work."
      pt-br:
        - "Eu não entendo o que você quer dizer."
        - "Isso não faz sentido neste contexto."
        - "Você não tem certeza de como fazer isso aqui."
        - "Essa ideia não parece levar a lugar nenhum."
        - "Você não consegue descobrir como fazer isso funcionar."
    effect:
      - "invalid_attempt_count += 1"