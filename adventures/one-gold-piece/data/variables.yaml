# `debug_variable` set to true shows the variable and its value in the DEBUG tab in-game
# `type` can be bool, int, float, object, list, string
# `description` is just a description of what the variable do or its use (currently it isn't being used)
# `min_value` and `max_value` are self-explanatory (they're for int types)

variables:
  # -------------------------------
  # Specific variables - All variables that are specific to this game must go here.
  # -------------------------------  
  open_cottage_door_count:
    type: int
    value: 0

  open_cottage_door_threshold:
    type: int
    value: 10

  loose_rock_moved:
    type: bool
    value: false
    debug_variable: true
  
  look_at_the_sun_count:
    type: int
    value: 0
    debug_variable: true

  look_at_the_sun_threshold:
    type: int
    value: 10

  talk_gerald_count:
    type: int
    value: 0
    debug_variable: true

  look_at_the_town_count:
    type: int
    value: 0
    debug_variable: true

  look_at_the_city_count:
    type: int
    value: 0
    debug_variable: true
  
  dog_friendship_threshold:
    type: int
    value: 5

  pet_dog_count:
    type: int
    value: 0
    min_value: 0
    max_value: 5
    debug_variable: true

  talk_dog_count:
    type: int
    value: 0
    debug_variable: true

  dog_is_following:
    type: bool
    value: false
    debug_variable: true

  pet_dragon_count:
    type: int
    value: 0
    debug_variable: true

  examine_sconce_count:
    type: int
    value: 0
    debug_variable: true

  brightness_step:
    type: float
    value: 0.1
    debug_variable: true

  # -------------------------------
  # General variables - All general, not game-specific variables, that can be used universally in any game, must go here (it doesn't mean this game makes use of them all necessarily).
  # -------------------------------  
  game_turn:
    type: int
    value: 0
    debug_variable: true

  invalid_attempt_count:
    type: int
    value: 0
    description: "Number of consecutive invalid actions. Resets to 0 on valid action."
    debug_variable: true

  current_player_actor:
    type: object
    value: aldric
    description: "Points to the current actor the player is playing with."
    debug_variable: true

  show_location_image_inline:
    type: bool
    value: true
    description: "Shows the current location image, if any, in the text output."
    debug_variable: true

  highlight_items:
    type: bool
    value: true

  highlight_items_emphasis:
    type: string
    value: "bold"
    possible_values: ["bold", "italic", "shake", "blink", "glow", "pulse", "wiggle", "grow", "shrink"]

  highlight_items_color:
    type: string
    value: "--accent"
    description: "Value can be empty so it uses the current text color, a CSS custom property like `--accent-text`, or a CSS hex color like `#000000`"