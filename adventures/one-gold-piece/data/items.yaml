items:

  # ─────────────────────────────────────────────
  # PLAYER EQUIPMENT
  # (worn/carried by Aldric at game start)
  # ─────────────────────────────────────────────

  leather_satchel:
    name:
      en: |
        Leather Satchel
    short_name:
      en: |
        leather satchel
    synonyms:
      en: ["satchel", "backpack", "bag", "pack", "leather bag", "leather satchel"]
    description:
      en: |
        A well-worn leather satchel with a brass buckle that no longer quite closes properly. It has the look of something that has been everywhere and remembered none of it.
    takeable: true
    wearable: true
    is_container: true
    container_type: in
    container_capacity: 10
    size: 10
    images: ["images/items/leather_satchel.png"]
    # Currently worn across your shoulder. It is, at this moment, empty.

  aldrics_sword:
    name:
      en: |
        Sword
    short_name:
      en: |
        {owner}'s sword
    synonyms:
      en: ["sword", "blade", "weapon", "old sword", "secondhand sword"]
    description:
      en: |
        A short sword of unremarkable provenance. The blade is serviceable if not inspiring, the grip wrapped in leather that has seen better decades, and there is a small nick near the crossguard that the previous owner described, unhelpfully, as [i]"character."[/i] You paid three silver for it. You may have overpaid.
    takeable: true
    owner: aldric
    size: 25
    images: ["images/items/aldrics_sword.png"]

  # ─────────────────────────────────────────────
  # COTTAGE DOORSTEP
  # ─────────────────────────────────────────────

  cottage_door:
    name:
      en: |
        Cottage Door
    short_name:
      en: |
        cottage door
    synonyms:
      en: ["door", "front door", "cottage door", "wooden door", "crooked door"]
    description:
      en: |
        A wooden door that hangs at a slight but definitive angle, as though it disagrees with the frame on a matter of principle. You have been meaning to fix this for three years.
      conditions:
        - if: "open_cottage_door_count < open_cottage_door_threshold"
          message:
            en: |
              The door is closed but not locked — there is nothing inside worth locking.
    openable:
      initial: closed
      lockable: true
      locked: false

  cottage_window:
    name:
      en: |
        Cottage Window
    synonyms:
      en: ["window", "cottage window", "shutters"]
    description:
      en: |
        A small window with wooden shutters, currently open to the morning air. The glass, such as it is, is wavy in the way of old glass that was trying its best. Through it you can see the inside of your cottage: a table, a chair, a bowl with yesterday's bread in it. None of these things will help you.

  neighbor_gerald:
    name:
      en: |
        Gerald
    synonyms:
      en: ["gerald", "neighbor", "neighbour", "man", "fellow"]
    description:
      en: |
        Gerald is your neighbor. He is tending his vegetable patch with the focused contentment of a man who has never, not once, made a bet he regretted. He waves when he sees you looking. He has waved at you every morning for eleven years. You have never had a conversation that lasted more than four sentences. This has suited both of you fine.
    is_actor: true

  aldrics_vegetable_patch:
    name:
      en: |
        Vegetable Patch
    synonyms:
      en: ["vegetable patch", "garden", "patch", "vegetables", "garden patch"]
    description:
      en: |
        A small vegetable patch along the side of the cottage. There are onions, some scraggly leeks, and what might be a turnip having a difficult year. None of it is ready to harvest. None of it is relevant to your current problem, except insofar as the current problem means you may not be around to harvest it.

  aldrics_well:
    name:
      en: |
        Well
    synonyms:
      en: ["well", "stone well", "water well"]
    description:
      en: |
        A modest stone well near the corner of the cottage. The rope and bucket are intact. The water is cold and reliable. It has never let you down, which puts it ahead of several other things in your life.

  # TODO: Improve description
  cottage_village_view:
    name:
      en: |
        Village
    synonyms:
      en: ["village", "view of village"]
    description:
      en: |
        This is the village you live in.

  # ─────────────────────────────────────────────
  # OLD CROSSROADS
  # ─────────────────────────────────────────────

  signpost:
    name:
      en: |
        Signpost
    synonyms:
      en: ["signpost", "sign", "post", "wooden sign", "directions"]
    description:
      en: |
        A weathered wooden signpost with three arms. The southern arm reads VILLAG (the "E" has been lost to time and indifference). The northern arm reads THE HILLS (PROBABLY FINE) in handwriting that suggests whoever wrote it had recently made a decision they were not entirely sure about. The third arm points directly at you. It reads CERTAIN DOOM. You check to see if it has a hinge. It does not. It has simply decided.

  stray_dog:
    name:
      en: |
        Stray Dog
    synonyms:
      en: ["dog", "stray", "stray dog", "hound", "mutt"]
    description:
      en: |
        A medium-sized dog of indeterminate breed and absolute self-possession. It is sitting very still and looking at you with the evaluative calm of an entity that has made its peace with the world and is now simply seeing what you intend to do with yours. It does not appear hungry. It does not appear lost. It appears, if anything, curious.

  hilltop_view:
    name:
      en: |
        Hills
    synonyms:
      en: ["hills", "distant hills", "view", "landscape", "horizon"]
    description:
      en: |
        The hills rise to the north — purple and substantial in the morning light. Somewhere inside them is a cave. Somewhere inside the cave is a dragon. Somewhere behind you is a debt. The hills are indifferent to all of this. This is perhaps the most honest thing about them.

  # ─────────────────────────────────────────────
  # HILLSIDE PATH
  # ─────────────────────────────────────────────

  adventurers_journal:
    name:
      en: |
        Battered Journal
    short_name:
      en: |
        battered journal
    synonyms:
      en: ["journal", "battered journal", "leather journal", "diary", "notebook", "book"]
    description:
      en: |
        A small leather journal, scorched along one edge as though something with a high internal temperature once breathed near it. The cover reads, in faded ink: FIELD NOTES — PERSONAL. Inside are roughly forty pages of entries covering a span of what appears to be several months: mundane observations, a recipe for traveling bread, notes on local geography, a running argument with a person referred to only as "T." about the correct way to pack a bedroll. The final entry is brief. It reads: "Found cave. Going in. Probably fine." The ink of that last entry is slightly scorched, as though written in proximity to something warm. There are no subsequent entries.
    takeable: true
    # is_readable: true
    size: 2
    images: ["images/items/adventurers_journal.png"]

  hillside_sheep:
    name:
      en: |
        Sheep
    synonyms:
      en: ["sheep", "ewe", "lamb", "flock", "animals"]
    description:
      en: |
        A small cluster of sheep on the slope above the path. They are grazing with total commitment, their jaws moving in the slow, satisfied rhythm of creatures who have never once considered their finances. One of them has turned to look at you. Its expression is difficult to characterize but might be described as non-judgmental. This is more than you are getting from most things today.

  loose_gravel:
    name:
      en: |
        Loose Gravel
    synonyms:
      en: ["gravel", "loose gravel", "stones", "loose stones", "pebbles"]
    description:
      en: |
        The path surface here is loose gravel that shifts underfoot in ways that seem deliberate. It is not dangerous, exactly. It is more in the category of mildly adversarial. Every few steps one stone rolls under your boot at the precise angle required to make you look undignified.

  gorse_bush:
    name:
      en: |
        Gorse Bush
    synonyms:
      en: ["gorse", "bush", "shrub", "gorse bush", "thorny bush"]
    description:
      en: |
        A large gorse bush beside the path, dense and thorny and slightly hostile in the way of plants that have made a decision about their boundaries. It was partially obscuring the journal. It does not appear to have done this on purpose, but it is hard to be certain.

  distant_village_view:
    name:
      en: |
        Village Below
    synonyms:
      en: ["village", "village below", "view of village", "distant village", "home"]
    description:
      en: |
        From here the village looks peaceful, which it is. Small smoke threads rise from chimneys. The inn where you lost the seventeen gold pieces is visible — or rather the building is visible; the specific table is not, which is probably for the best. Gerald's vegetable patch is a small rectangle of green. Everything looks fine. The operative word, as in several places today, is "looks."

  # ─────────────────────────────────────────────
  # CAVE MOUTH
  # ─────────────────────────────────────────────

  scorched_rock:
    name:
      en: |
        Scorched Rock
    synonyms:
      en: ["scorched rock", "burned rock", "blackened rock", "scorch marks", "burn marks"]
    description:
      en: |
        The rock around the cave entrance is blackened in broad, radiating patterns consistent with something very large exhaling with intent. The scorch marks extend further than seems strictly necessary, which suggests that whatever produced them was either making a point or simply has a lot of breath. Possibly both.

  claw_marks:
    name:
      en: |
        Claw Marks
    synonyms:
      en: ["claw marks", "scratches", "gouges", "claw gouges", "marks"]
    description:
      en: |
        Deep parallel grooves cut into the stone on either side of the cave entrance. Each individual groove is wider than your forearm. The marks are old and numerous — scored over time, not in a single event. Whatever made them has been using this entrance for a very long time. The grooves are also, you notice, quite evenly spaced. Almost tidy.

  no_soliciting_sign:
    name:
      en: |
        No Soliciting Sign
    synonyms:
      en: ["sign", "wooden sign", "no soliciting", "notice", "sign post"]
    description:
      en: |
        A small wooden sign on a short stake beside the cave entrance. It reads, in neat block letters: [wiggle][i]"LAIR — NO SOLICITING"[/i][/wiggle]. Beneath that, in smaller and more cramped handwriting, a secondary annotation: [i]"This means you, Gerald"[/i]. You examine the back of the sign. It also reads: [i]"This means you, Gerald"[/i]. Whoever Gerald is, the matter was apparently worth being thorough about.
    # is_readable: true

  sulfur_smell:
    name:
      en: |
        Smell of Sulfur
    synonyms:
      en: ["sulfur", "smell", "stench", "odor", "brimstone", "sulfur smell"]
    description:
      en: |
        The smell is not overpowering, but it is present and consistent — the particular sharp, mineral quality of sulfur that one associates with volcanic activity, certain types of unpleasant magic, and dragons. It hangs in the air around the cave entrance like a final advisory. There is nothing to take. There is nothing to interact with. It is simply a smell, doing its job.
    visible: false

  cave_mouth_rubble:
    name:
      en: |
        Cave Rubble
    synonyms:
      en: ["rubble", "rocks", "debris", "cave rubble", "stone rubble", "rock pile"]
    description:
      en: |
        Chunks of stone and loose debris around the base of the cave entrance, some scorched, some simply old. Mixed in are fragments of things that were once other things: a boot sole, a rusted buckle, what appears to be a door hinge from somewhere. The cave has been in operation for a long time.

  # ─────────────────────────────────────────────
  # NARROW PASSAGE
  # ─────────────────────────────────────────────

  torch_sconce:
    name:
      en: |
        Torch Sconce
    synonyms:
      en: ["sconce", "torch sconce", "torch holder", "iron sconce", "wall sconce"]
    description:
      en: |
        An iron torch sconce bolted to the cave wall at about head height, currently empty. The sconce itself is finely made — decorative scrollwork along the bracket, a small flame motif engraved at the base. Someone put craftsmanship into this sconce. Someone cared. That someone is, based on the available evidence in this passage, no longer in a position to appreciate it.

  appointments_skeleton:
    name:
      en: |
        Skeleton
    synonyms:
      en: ["skeleton", "bones", "remains", "dead adventurer", "secretary", "body"]
    description:
      en: |
        A complete skeleton in the remains of what was once a practical outfit — leather armor (cracked), a belt (intact but empty), boots (still on, still fastened, which says something about their quality). The skeleton is seated upright against the wall with a posture that suggests, even in death, a person who took their work seriously. The clipboard is in its lap. The expression is, of course, neutral. Skeletons are good at that.

  appointments_clipboard:
    name:
      en: |
        Appointments Clipboard
    short_name:
      en: |
        clipboard
    synonyms:
      en: ["clipboard", "schedule", "appointments", "papers", "document", "sheet"]
    description:
      en: |
        A wooden clipboard with a spring clamp, holding several sheets of parchment. The top sheet is headed [b][i]APPOINTMENTS — WEEK OF THE HARVEST MOON[/i][/b] and contains a neatly organized schedule in small, careful handwriting: time slots, names, brief notes ([i]"bring identification," "no weapons in treasury," "wipe feet"[/i]). Every entry has been crossed out. In a different hand — much larger, and applied with what appears to have been a single stroke — someone has written across the whole page: [b][i]"CANCELLED (ALL OF THEM)"[/i][/b]. There is a certain finality to it.
    takeable: true
    # is_readable: true
    size: 2
    images: ["images/items/appointments_clipboard.png"]

  warm_cave_walls:
    name:
      en: |
        Cave Walls
    synonyms:
      en: ["walls", "cave walls", "rock walls", "warm walls", "stone walls"]
    description:
      en: |
        The walls of the passage are warm to the touch — not uncomfortably so, but distinctly warmer than stone has any reason to be. The heat is consistent, coming from somewhere deeper inside. It is the kind of warmth that, in any other context, might be described as pleasant.

  # ─────────────────────────────────────────────
  # ANTECHAMBER
  # ─────────────────────────────────────────────

  notice_board:
    name:
      en: |
        Notice Board
    synonyms:
      en: ["notice board", "cork board", "board", "bulletin board", "notices", "pinboard"]
    description:
      en: |
        A cork board mounted on the wall with a masonry spike, bearing several pinned items. A detailed weekly schedule, color-coded by category (red for [color=#FF0000][i]"adventurer visits,"[/i][/color] blue for [color=#0000FF][i]"administrative,"[/i][/color] green for [color=#00FF00][i]"personal"[/i][/color]). A hand-lettered list of rules headed [b][i]DO NOT[/i][/b], covering: taking gold without written authorization, touching the scrolls, entering the study without knocking, feeding the stalagmites (this one has an asterisk; the footnote reads [i]"they are not pets"[/i]). A hand-drawn map of the cave system with extensive annotations. And a small card at the bottom that reads: [i]Hours: By appointment only. Walk-ins will be assessed on a case by case basis. Most cases are unfavorable.[/i]
    # is_readable: true

  adventurers_trophy_shelf:
    name:
      en: |
        Trophy Shelf
    synonyms:
      en: ["trophy shelf", "shelf", "trophies", "ledge", "collection", "adventurer stuff"]
    description:
      en: |
        A low stone ledge running along one wall, bearing a collection of objects organized by apparent type. Six helms, varying in style and era, arranged by size. Eight swords of various lengths, propped against the wall behind them. A shield with a coat of arms that is mostly rust. One lute, slightly singed, propped at the far end at an angle that suggests it was placed last and perhaps with less care. Each item has a small tag attached. The tags are handwritten, and most read, in one variation or another: left behind (unclaimed).

  arranged_stalagmites:
    name:
      en: |
        Stalagmites
    synonyms:
      en: ["stalagmites", "rock formations", "formations", "stones", "cave formations"]
    description:
      en: |
        A cluster of stalagmites arranged in a rough semicircle, clearly not in their original positions. The floor around their bases shows drag marks where they were moved — no small undertaking, given their size. The arrangement has a considered quality to it, as though someone stood back and evaluated and then nudged one slightly to the left. There is, objectively, no reason to do this. And yet here they are.

  cave_rules_list:
    name:
      en: |
        Rules List
    synonyms:
      en: ["rules", "rules list", "do not list", "list", "cave rules"]
    description:
      en: |
        The rules list is pinned to the notice board. It is headed [b][i]DO NOT[i][/b] in large letters and covers: taking gold without written authorization, touching the scrolls without gloves, entering the study, feeding the stalagmites, bringing livestock into the lair, asking about [i]"the incident of 1243,"[/i] using the word [i]"hoard"[/i] in a derogatory sense, and leaving without signing the visitor log. You look around for a visitor log. There is no visitor log visible. This may be the point.
    # is_readable: true

  cave_map_pinned:
    name:
      en: |
        Cave Map
    synonyms:
      en: ["map", "cave map", "hand-drawn map", "lair map", "annotated map"]
    description:
      en: |
        A hand-drawn map of the cave system, rendered in ink on a piece of parchment pinned to the notice board. It is accurate and detailed — every passage, every chamber, every alcove. The main chamber is labeled [b][i]HERE BE ME (OBVIOUSLY)[/b][/i]. The treasury is labeled [b][i]PRIVATE — THIS MEANS EVERYONE[/b][/i]. The study is labeled [b][i]ABSOLUTELY NOT[/b][/i]. The back passage behind the main chamber is labeled on the map, but the label has been carefully scratched out and replaced with a small drawing of a cloud.
    # is_readable: true

  # ─────────────────────────────────────────────
  # TREASURY
  # ─────────────────────────────────────────────

  gold_hoard:
    name:
      en: |
        Gold Hoard
    synonyms:
      en: ["gold", "hoard", "coins", "gold coins", "treasure", "gold pieces", "pile of gold"]
    description:
      en: |
        The gold fills the chamber wall to wall, taller than you in places — an almost geological accumulation of coins, ingots, medallions, goblets, rings, chains, and objects whose original purpose has been entirely subsumed by the act of being valuable. The ambient glow of the cave catches it and scatters across the ceiling in warm, complicated patterns. It is extraordinarily beautiful. It is also, per the ledger, completely itemized. You could not take seventeen gold pieces from this room. You could not take one. You could not take a single button off a single forgotten coat without it being noted.

  treasury_ledger:
    name:
      en: |
        Treasury Ledger
    synonyms:
      en: ["ledger", "book", "inventory ledger", "account book", "records", "treasury ledger"]
    description:
      en: |
        An enormous leather-bound ledger, the size of a small table, resting open on the stone lectern. Its pages are dense with columns of figures in a cramped, precise hand: item descriptions, acquisition dates, estimated values, current locations within the hoard, condition notes, and a column headed LAST VERIFIED, which contains today's date for every entry. The most recent entry at the top of the open page reads: "1x Short Sword (secondhand, fair condition, previous owner: unknown) — acquired this morning, visitor intake, entrance gallery." You look at the shelf in the antechamber. You look back at the ledger. The dragon has accounted for everything.
    # is_readable: true

  treasury_quill:
    name:
      en: |
        Quill Pen
    short_name:
      en: |
        quill pen
    synonyms:
      en: ["quill", "pen", "quill pen", "feather pen", "writing quill"]
    description:
      en: |
        A large quill pen resting in an inkwell beside the ledger. The feather is from something with a substantial wingspan. The ink in the pot is fresh — still glossy where it was last used. The implication is that the ledger is updated regularly, and recently. You consider whether picking up the quill would count as an interaction with the ledger. You decide that, in this room, everything counts as an interaction with the ledger.
    takeable: true
    size: 2
    images: ["images/items/treasury_quill.png"]

  gemstone_pile:
    name:
      en: |
        Gemstones
    synonyms:
      en: ["gems", "gemstones", "jewels", "precious stones", "rubies", "diamonds", "sapphires"]
    description:
      en: |
        A portion of the hoard given over to unset gemstones — rubies, sapphires, emeralds, and several stones you cannot name, in colors that seem to be making an argument for the inadequacy of language. They are beautiful in a way that feels slightly threatening. They have their own ledger entries. You can see them from here.

  silver_goblets:
    name:
      en: |
        Silver Goblets
    synonyms:
      en: ["goblets", "silver goblets", "cups", "chalices", "silverware"]
    description:
      en: |
        A stack of silver goblets near the west wall, clean and polished. They appear to be from several different sets — some matching, some clearly individual pieces, all valuable. One of them has an inscription on the base. You can just make it out: To Roderick, on the occasion of his retirement. Many happy returns. The goblet is in the hoard. Roderick, presumably, is not.

  coin_sacks:
    name:
      en: |
        Coin Sacks
    synonyms:
      en: ["sacks", "coin sacks", "bags", "coin bags", "money bags"]
    description:
      en: |
        Several large canvas sacks, closed and stamped with what appear to be merchant house seals from various towns and cities — some of which you recognize, some of which you don't, and at least one of which appears to no longer exist. The sacks are heavy and do not move when you consider nudging one with your boot. They have ledger entries. Everything here has ledger entries.

  # ─────────────────────────────────────────────
  # DRAGON'S CHAMBER
  # ─────────────────────────────────────────────

  vermithrax:
    name:
      en: |
        Vermithrax
    synonyms:
      en: ["dragon", "vermithrax", "red dragon", "creature", "beast", "monster", "him", "he"]
    description:
      en: |
        Vermithrax is old, enormous, and red in the specific shade of red that has decided it does not need to justify itself. He is curled in the center of the chamber with the settled authority of a geographical feature. His scales catch the light in ways that suggest they have been doing this for centuries and have no intention of stopping. One eye — copper-colored, cartwheel-sized — is currently directed at you with an expression that manages, across a significant species barrier, to communicate something in the vicinity of mild administrative inconvenience.

        He has not eaten you. This continues to be notable.
    is_actor: true

  appointment_book:
    name:
      en: |
        Appointment Book
    synonyms:
      en: ["appointment book", "book", "diary", "calendar", "schedule book", "leather book"]
    description:
      en: |
        A leather-bound appointment book, open to today's date. The pages are organized by hour, in small, precise handwriting. Most of today's slots are either empty or marked [b][i]ADMINISTRATIVE[/b][/i]. The noon slot reads, in slightly larger text: [b][i]A VILLAGER (DEBT-RELATED, PROBABLY)[/b][/i]. It is underlined. Twice. A notation beside it in the margin reads: [i]"allocate 15 mins max; refer to standard resolution options if cooperative".[/i] You are not sure whether to be offended that he only allocated fifteen minutes or reassured that there is a standard resolution.
    # is_readable: true

  dragon_firepit:
    name:
      en: |
        Firepit
    synonyms:
      en: ["firepit", "fire pit", "fire", "embers", "hearth", "pit"]
    description:
      en: |
        A broad, shallow depression in the cave floor near the center of the chamber, filled with embers that glow a deep, consistent orange. There is no wood — the heat appears to be self-sustaining in a way that does not bear thinking about too hard. The warmth radiates out across the entire chamber and is, taken entirely out of context, quite pleasant.

  loose_rock_north_wall:
    name:
      en: |
        Loose Rock
    synonyms:
      en: ["loose rock", "rock", "stone", "loose stone", "north wall rock", "boulder"]
    description:
      en: |
        A section of the northern cave wall where one large rock sits slightly proud of the surrounding surface — not dramatically, but noticeably, in the way of something that was meant to fit flush and no longer quite does. The gap around it is narrow but consistent. It looks like it could be moved. It also looks like it is directly behind a dragon, which significantly affects the risk calculation.

  claw_marks_floor:
    name:
      en: |
        Claw Marks on Floor
    synonyms:
      en: ["floor marks", "claw marks", "scratches", "floor scratches", "floor"]
    description:
      en: |
        Deep parallel grooves worn into the cave floor, concentrated around the center of the chamber where Vermithrax rests. They form a rough circular pattern, as though something large has been settling and resettling in the same spot over a very long period of time. The grooves are deep. The time implied is considerable.

  # ─────────────────────────────────────────────
  # DRAGON'S STUDY
  # ─────────────────────────────────────────────

  dragons_reading_chair:
    name:
      en: |
        Reading Chair
    synonyms:
      en: ["chair", "reading chair", "armchair", "velvet chair", "oversized chair", "big chair"]
    description:
      en: |
        An armchair the size of a modest outbuilding, upholstered in red velvet that has developed, over the years, the specific texture of velvet that has been sat in by something enormous and warm for a very long time. The arms are worn smooth. The back has a faint imprint of scale-pattern pressed into the fabric. It looks, in the way of very large furniture, almost cozy. You could sleep in this chair. You could raise a family in this chair.

  scroll_shelf:
    name:
      en: |
        Scroll Shelf
    synonyms:
      en: ["shelf", "scroll shelf", "shelves", "scrolls", "book shelf", "stone shelf"]
    description:
      en: |
        A shelf carved directly into the cave wall, lined with scrolls. They are organized by a system that is not immediately apparent — not alphabetically, not by size, not by apparent age. Several are labeled in a script you don't recognize. A few bear small colored wax seals. One scroll, on the end, has a tag that reads: DO NOT READ (THIS MEANS YOU). The prohibition is helpfully bilingual; the second language is one you have never seen before.

  letter_to_mum:
    name:
      en: |
        Unfinished Letter
    synonyms:
      en: ["letter", "unfinished letter", "note", "correspondence", "parchment", "letter to mum"]
    description:
      en: |
        A piece of parchment on the stone desk, partially written and extensively revised. The salutation reads: [i]Dear Mum[/i]. The following lines have been crossed out in sequence, with increasing force: first attempt illegible under the crossing-out; second attempt: Things are much the same; third attempt: I have been thinking about what you said about the lair; fourth attempt, partially preserved: I am well. The cave is fine. The mortals keep coming. You were right about the filing system. This line stands uncrossed. Beneath it, after a gap, a postscript has been started and abandoned: [i]Give my regards to[/i] — Nothing follows. The quill has been set down mid-sentence.
    # is_readable: true

  small_crown_paperweight:
    name:
      en: |
        Crown Paperweight
    short_name:
      en: |
        crown
    synonyms:
      en: ["crown", "paperweight", "small crown", "little crown", "golden crown"]
    description:
      en: |
        A small crown being used as a paperweight to hold down the letter. It is gold, set with three modest stones, and sized for a human head. It is not decorative — or rather, it was not made to be decorative; it was made to be worn by someone important. It is now holding down a half-finished letter. The stones catch the candlelight. You consider picking it up, then remember where you are, and then notice it does not appear to be in the ledger, and then decide that the absence from the ledger is somehow more concerning than its presence would have been.
    takeable: true
    size: 10
    images: ["images/items/small_crown_paperweight.png"]

  stone_desk:
    name:
      en: |
        Stone Desk
    synonyms:
      en: ["desk", "stone desk", "table", "flat stone", "work surface"]
    description:
      en: |
        A flat slab of stone supported at either end by smaller rocks, forming a functional desk surface. The top is smooth from use. There are ink stains in one corner — old, overlapping, in the accumulated pattern of someone who has been writing at this surface for a very long time.

  # ─────────────────────────────────────────────
  # BACK PASSAGE
  # ─────────────────────────────────────────────

  stone_box:
    name:
      en: |
        Stone Box
    short_name:
      en: |
        stone box
    synonyms:
      en: ["stone box", "box", "container", "small box", "stone container"]
    description:
      en: |
        A small box carved from a single piece of pale stone, about the size of a bread loaf. The lid fits precisely — no hinge, just friction and craftsmanship. There is no lock. There is no label. There is, from the floor around it, the distinct impression of a very large claw print pointing toward it. The box is not hidden. It has simply been waiting.
    # is_container: true
    # is_openable: true
    # is_open: false
    contents: [promissory_note]
    openable:
      initial: closed
      lockable: false
      locked: false
      show_current_state: true

  promissory_note:
    name:
      en: |
        Promissory Note
    short_name:
      en: |
        promissory note
    synonyms:
      en: ["promissory note", "note", "document", "parchment", "letter of credit", "gold note", "certificate"]
    description:
      en: |
        A folded piece of parchment, formal in character. At the top, in decorative script: PROMISSORY NOTE. The body reads: The bearer of this document is entitled to the sum of twenty (20) gold pieces, redeemable at any recognized merchant house operating within the kingdom, upon presentation of this document. No questions will be asked. The note is dated several years ago. At the bottom, a signature: Vermithrax R., Esq. The signature is perfectly legible and, you notice, slightly larger than the allotted signature line, as though the signer needed a moment to scale down.
    takeable: true
    visible: false
    # starting_contained_by: stone_box
    size: 1
    images: ["images/items/promissory_note.png"]

  hidden_alcove_dust:
    name:
      en: |
        Dusty Floor
    synonyms:
      en: ["dust", "floor", "alcove floor", "dusty floor", "cave floor"]
    description:
      en: |
        The floor of the alcove is covered in a thin, undisturbed layer of dust — except for the claw print in the center, which is crisp and deliberate. The dust suggests no one has been here in years. The claw print suggests someone checked recently to make sure.

  vermithrax_small_note:
    name:
      en: |
        Small Note
    short_name:
      en: |
        small note
    synonyms:
      en: ["small note", "note", "message", "little note", "card"]
    description:
      en: |
        A small piece of parchment tucked beneath the stone box, slightly creased. It reads, in the same handwriting as the promissory note: For whoever actually makes it this far without being annoying about it. — V. The note has no date. The handwriting is neat. The sentiment is, by any measure, the warmest thing that has been communicated to you today.
    takeable: true
    visible: false
    starting_contained_by: stone_box
    size: 1
    images: ["images/items/vermithrax_small_note.png"]

  # ─────────────────────────────────────────────
  # CAVE EXIT & CROSSROADS RETURN
  # (items here are references to earlier items
  #  appearing in resolution locations)
  # ─────────────────────────────────────────────

  scorched_rock_exit:
    name:
      en: |
        Scorched Rock
    synonyms:
      en: ["scorched rock", "burned rock", "blackened stone", "scorch marks"]
    description:
      en: |
        The same scorched rock as the entrance, seen from outside again. From this angle, in the afternoon light, the burn patterns look less like a warning and more like a signature. Vermithrax has been leaving this mark for a very long time. It means: this is mine. It means: I am still here. It means, depending on your afternoon: you made it out.

  afternoon_light:
    name:
      en: |
        Afternoon Light
    synonyms:
      en: ["light", "sunlight", "afternoon sun", "sun", "daylight"]
    description:
      en: |
        The sun has moved since you went in. It is lower now, warmer in color, casting long shadows from the hills across the path below. It is unambiguously afternoon. You are unambiguously alive. Both of these things remain, for the moment, true simultaneously.

  signpost_return:
    name:
      en: |
        Signpost
    synonyms:
      en: ["signpost", "sign", "post", "wooden sign", "crossroads sign"]
    description:
      en: |
        The crossroads signpost, as before, but changed in one respect: the arm that previously pointed at you and read CERTAIN DOOM now points west, toward an unremarkable stretch of scrubland. You check the hinge. It is, actually, slightly loose. This is probably the explanation. You find yourself preferring the other one.

  village_view_afternoon:
    name:
      en: |
        Village in Afternoon Light
    synonyms:
      en: ["village", "village view", "home", "village below", "distant village"]
    description:
      en: |
        The village sits in the afternoon light, warm and small and entirely unaware of what you have just done. Smoke from chimneys. The inn where this started is visible. Brom the tavern keeper is in there somewhere, keeping time. You have what you need. The sun has not yet set. You feel, against all reasonable expectation, fine.
    visible: true

  # ─────────────────────────────────────────────
  # MISC.
  # ─────────────────────────────────────────────
  
  morning_sun:
    name:
      en: |
        Morning Sun
    short_name:
      en: |
        sun
    synonyms:
      en: ["sun", "morning sun", "sol"]

  town_misnomer:
    name:
      en: |
        Town
    short_name:
      en: |
        town
    synonyms:
      en: ["town"]

  city_misnomer:
    # name:
    #   en: |
    #     City
    # short_name:
