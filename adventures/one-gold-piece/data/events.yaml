events:
  - id: dog_following_player_actor
    type: location_enter
    conditions: ["dog_is_following == true"]
    effect:
      - "removeItemFromAllLocations('stray_dog')"
      - "here.add('stray_dog')"

  - id: actor_has_bladder_full
    type: recurring
    interval: 1
    conditions:
      - "here.has('newborn_daughter')"
      - "!inventory.has(newborn_daughter)"
      - "newborn_daughter_health > 0"
    message:
      en: |
        You can hear your baby crying desperately.