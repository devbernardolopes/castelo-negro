# All three item description patterns now work:
# Item format                     Example	                            desc.base desc.conditions Base text source
# {en, pt-br} (no conditions)     cottage_key	                        undefined falsy           _pickLang(desc) via line 624
# {en, pt-br, conditions}	        cottage_kitchen_table, husband_belt undefined truthy          _pickLang(desc) via line 614 fallback
# {base: {en, pt-br}, conditions} (locations)	                        truthy    truthy          _pickLang(desc.base) via line 614 primary

items:
  # -------------------------------
  # Sabine's Items
  # -------------------------------
  sabine_cell_phone:
    name:
      en: |
        {owner}'s Cell Phone
    synonyms:
      en: ["cell phone", "phone"]
    takeable: true
    owner: sabine
    size: 1
    description:
      en: |
        A sleek smartphone.
    images: ["images/items/tti-2026-05-31T17-49-06-403406110.png"]

  sabine_jeans_pants_pocket:
    name:
      en: |
        {owner}'s Jeans Pants Pocket
    short_name:
      en: |
        front pocket
    synonyms:
      en: ["pocket", "jeans pocket", "pants pocket"]
    contents: [sabine_cell_phone]
    show_in_inventory: false
    container_capacity: 1
    owner: sabine
    description:
      en: |
        The front pocket of {owner}'s jeans pants.
      conditions:
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor != 'sabine'"
          message:
            en: |
              You can see the outline of Sabine's cell phone.
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor == 'sabine'"
          message:
            en: |
              You can see the outline of your cell phone.

  sabine_jeans_pants:
    name:
      en: |
        {owner}'s Jeans Pants
    short_name:
      en: |
        jeans
    synonyms:
      en: ["jeans", "pants", "jeans pants", "👖"]
    takeable: true
    wearable: true
    owner: sabine
    size: 2
    contents: [sabine_jeans_pants_pocket]
    description:
      en: |
        A pair of women's stylish skinny jeans in indigo blue color. They have a high waist and a slim fit, accentuating the wearer's figure. The jeans feature classic five-pocket styling, with two front pockets, two back pockets, and a small coin pocket on the right side. The front pockets are adorned with silver rivets for added durability and style. The jeans are made of a stretchy denim fabric that provides comfort and flexibility for all-day wear. The waistband has belt loops, allowing for accessorizing with a belt if desired. Overall, these jeans are a fashionable and versatile addition to any wardrobe.
    images: ["images/items/tti-2026-05-31T17-42-03-25590608.png"]
  
  sabine_tank_top:
    name:
      en: |
        {owner}'s Tank Top
    short_name:
      en: |
        tank top
    synonyms:
      en: ["tank top", "top", "sabine's tank top"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A simple women's white tank top made of soft cotton fabric. It has a classic design with a scoop neckline and thin shoulder straps, providing a comfortable and breathable fit for warm weather. The tank top is versatile and can be easily paired with various bottoms, making it a staple piece in any woman's wardrobe.
    images: ["images/items/tti-2026-06-01T21-28-28-176196360.png"]

  sabine_silver_strappy_sandals:
    name:
      en: |
        {owner}'s Silver Strappy Sandals
    short_name:
      en: |
        silver strappy sandals
    synonyms:
      en: ["silver strappy sandals", "sandals", "shoes", "strappy sandals", "silver sandals", "silver shoes", "strappy shoes"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A pair of elegant silver strappy sandals with a low heel. The sandals feature thin straps that crisscross over the foot and secure with a small buckle at the ankle, providing a stylish and comfortable fit. The silver color adds a touch of glamour, making these sandals perfect for dressing up any outfit for a night out or special occasion.
    images: ["images/items/tti-2026-06-01T21-32-12-288403318.png"]

  # -------------------------------
  # Location Items
