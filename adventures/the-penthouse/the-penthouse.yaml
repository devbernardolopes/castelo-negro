metadata:
  title: The Penthouse
  author: Bernardo Crivellaro Lopes
  version: 1.0
  languages: [en]
  default_language: en
  assets_path: "assets/"
  data_path: "data/"
  data_files: ["items.yaml", "locations.yaml", "actions.yaml", "actors.yaml", "strings.yaml", "variables.yaml", "verbs.yaml", "properties.yaml"]
  allow_direct_input: true
  debug: false
  auto_container_description: false
  show_continue_message: true
  continue_message:
    en: "[glow][i]\[Press any key to continue...\][/i][/glow]"
  highlight_color_verbs: "#FF0000"
  highlight_color_items: "#0000FF"
  tabs:
    system:
      en: "System"
      visible: true
    room:
      en: "Room"
      visible: true
    inventory:
      en: "Inventory"
      visible: true
    stats:
      en: "Stats"
      visible: true
    relationships:
      en: "Relationships"
      visible: true
    map:
      en: "Map"
      visible: true

# Syntax	                                                        Produces
# [b]text[/b]	                                                    <strong>text</strong>
# [i]text[/i]	                                                    <em>text</em>
# [color=accent-text]text[/color]	                                <span style="color:var(--accent-text)">
# [color=#FF0000]text[/color]	                                    <span style="color:#FF0000">
# [shake], [blink], [glow], [pulse], [wiggle], [grow], [shrink]   <span class="effect-...">
# \[ / \]	                                                        literal [ / ]
# unknown tags	                                                  silently skipped
# improper nesting	                                              gracefully handled (unmatched closes ignored, unclosed opens auto-closed)