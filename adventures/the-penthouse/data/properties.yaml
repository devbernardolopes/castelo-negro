# Usage examples
# Conditions:
# - health < 50 — current player's health (spread into eval context)
# - mood == "sad" — current player's mood
# - getActorProp('sabine', 'health') > 0 — any actor's property
# - getRelationship('sabine', 'affinity') >= 50 — affinity toward Sabine
# - getRelationshipBetween('protagonist', 'sabine', 'affinity') >= 50
# Effects (actor-neutral — explicit actorId required):
# - setActorProp(current_player_actor, 'health', 90) — clamp to global constraints
# - setActorProp('protagonist', 'health', 90) — literal actor ID
# - setActorProp('sabine', 'mood', 'happy') — any actor's property
# - setRelationship(current_player_actor, 'sabine', 'affinity', 20)
# - setRelationship('protagonist', 'sabine', 'affinity', 20)
# - setPlayerActor('sabine') — switch who you control mid-game
# Messages:
# - Your health is {health}.
# - Sabine looks {actor_sabine_mood}.
# - Relationship affinity: {relationship_sabine_affinity}%

properties:
  age:
    type: int
    min_value: 0
    default: 25
    is_stat: true
  gender:
    type: string
    possible_values: ["male", "female", "non-binary", "other"]
    default: "other"
    is_stat: true
  mood:
    type: string
    possible_values: ["neutral", "happy", "sad", "anxious", "nervous", "angry", "excited", "bored", "curious"]
    default: "neutral"
  hair:
    type: string
    possible_values: ["bald", "black", "brown", "blonde", "red", "gray", "white"]
    default: "black"
  is_alive:
    type: bool
    default: true
  is_conscious:
    type: bool
    default: true
  is_awake:
    type: bool
    default: true
  is_sleeping:
    type: bool
    default: false
  stamina:
    type: int
    min_value: 0
    max_value: 100
    default: 100
    is_stat: true
  health:
    type: int
    min_value: 0
    max_value: 100
    default: 100
    is_stat: true
  amount_of_vacations:
    type: int
    min_value: 0
    default: 0
    is_stat: true
  relationship_level:
    type: string
    possible_values: ["strangers", "acquaintances", "partners", "enemies"]
    default: "strangers"
  affinity:
    type: int
    min_value: -100
    max_value: 100
    default: 0

