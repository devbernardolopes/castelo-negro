      en: |
        A large flat-screen TV mounted on the far wall of the living room, providing a state-of-the-art entertainment experience. The TV has a sleek design with a thin bezel and high-resolution display, perfect for watching movies, shows, or streaming content while enjoying the luxurious ambiance of the penthouse living room.

  my_rival_my_love_part_1_book:
    name:
      en: |
        Book "My Rival, My Love - Part 1"
    short_name:
      en: |
        my rival my love book
    synonyms:
      en: ["my rival my love book", "book", "novel"]
    takeable: true
    size: 1
