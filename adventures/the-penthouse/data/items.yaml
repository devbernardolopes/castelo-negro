items:
  # -------------------------------
  # Anya's Items
  # -------------------------------
  anya_white_leggings:
    name:
      en: |
        {owner}'s White Leggings
    short_name:
      en: |
        white leggings
    synonyms:
      en: ["white leggings", "leggings", "anya's leggings"]
    takeable: true
    wearable: true
    owner: anya
    size: 1
