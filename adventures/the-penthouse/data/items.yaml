# All three item description patterns now work:
# Item format                     Example	                            desc.base desc.conditions Base text source
# {en, pt-br} (no conditions)     cottage_key	                        undefined falsy           _pickLang(desc) via line 624
# {en, pt-br, conditions}	        cottage_kitchen_table, husband_belt undefined truthy          _pickLang(desc) via line 614 fallback
# {base: {en, pt-br}, conditions} (locations)	                        truthy    truthy          _pickLang(desc.base) via line 614 primary

items:
  # -------------------------------
  # Sabine's Items
  # -------------------------------
  sabine_cell_phone:
    name:
      en: |
        {owner}'s Cell Phone
    synonyms:
      en: ["cell phone", "phone", "sabine's phone"]
    takeable: true
    owner: sabine
    size: 1
    description:
      en: |
        A sleek smartphone.
    images: ["images/items/tti-2026-05-31T17-49-06-403406110.png"]

  sabine_jeans_pants_pocket:
    name:
      en: |
        Sabine's Jeans Pants Pocket
    short_name:
      en: |
        front pocket
    synonyms:
      en: ["pocket", "sabine's pocket", "jeans pocket", "pants pocket", "sabine's jeans pocket", "sabine's pants pocket"]
    contents: [sabine_cell_phone]
    show_in_inventory: false
    container_capacity: 1
    description:
      en: |
        The front pocket of Sabine's jeans pants.
      conditions:
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor != 'sabine'"
          message:
            en: |
              You can see the outline of Sabine's cell phone.
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor == 'sabine'"
          message:
            en: |
              You can see the outline of your cell phone.

  sabine_jeans_pants:
    name:
      en: |
        {owner}'s Jeans Pants
    short_name:
      en: |
        jeans
    synonyms:
      en: ["jeans", "pants", "sabine's jeans", "sabine's pants"]
    takeable: true
    wearable: true
    owner: sabine
    size: 2
    contents: [sabine_jeans_pants_pocket]
    description:
      en: |
        A pair of women's stylish skinny jeans in indigo blue color. They have a high waist and a slim fit, accentuating the wearer's figure. The jeans feature classic five-pocket styling, with two front pockets, two back pockets, and a small coin pocket on the right side. The front pockets are adorned with silver rivets for added durability and style. The jeans are made of a stretchy denim fabric that provides comfort and flexibility for all-day wear. The waistband has belt loops, allowing for accessorizing with a belt if desired. Overall, these jeans are a fashionable and versatile addition to any wardrobe.
    images: ["images/items/tti-2026-05-31T17-42-03-25590608.png"]
  
  sabine_tank_top:
    name:
      en: |
        {owner}'s Tank Top
    short_name:
      en: |
        tank top
    synonyms:
      en: ["tank top", "top", "sabine's tank top"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A simple women's white tank top made of soft cotton fabric. It has a classic design with a scoop neckline and thin shoulder straps, providing a comfortable and breathable fit for warm weather. The tank top is versatile and can be easily paired with various bottoms, making it a staple piece in any woman's wardrobe.
    images: ["images/items/tti-2026-06-01T21-28-28-176196360.png"]

  sabine_silver_strappy_sandals:
    name:
      en: |
        {owner}'s Silver Strappy Sandals
    short_name:
      en: |
        silver strappy sandals
    synonyms:
      en: ["silver strappy sandals", "sandals", "shoes", "sabine's sandals"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A pair of elegant silver strappy sandals with a low heel. The sandals feature thin straps that crisscross over the foot and secure with a small buckle at the ankle, providing a stylish and comfortable fit. The silver color adds a touch of glamour, making these sandals perfect for dressing up any outfit for a night out or special occasion.
    images: ["images/items/tti-2026-06-01T21-32-12-288403318.png"]

  # -------------------------------
  # Bernie's Items
  # -------------------------------
  bernie_credit_card:
    name:
      # Previously: Bernie's Credit Card
      # Review if the possessive form is necessary or if "Bernie's" can be omitted since the owner is already specified in the item definition.
      en: |
        {owner}'s Credit Card
    synonyms:
      en: ["credit card", "card", "bernie's card"]
    takeable: true
    owner: bernie
    size: 1
    description:
      en: |
        A credit card with Bernie's name on it.
    images: ["images/items/tti-2026-05-31T17-45-10-875944803.png"]

  bernie_jeans_pants_pocket:
    name:
      en: |
        Bernie's Jeans Pants Pocket
    short_name:
      en: |
        back pocket
    synonyms:
      en: ["pocket", "bernie's pocket", "jeans pocket", "pants pocket", "bernie's jeans pocket", "bernie's pants pocket"]
    contents: [bernie_credit_card]
    container_capacity: 1
    show_in_inventory: false
    description:
      en: |
        The back pocket of Bernie's jeans pants.
  
  bernie_jeans_pants:
    name:
      en: |
        {owner}'s Jeans Pants
    short_name:
      en: |
        jeans
    synonyms:
      en: ["jeans", "pants", "bernie's jeans", "bernie's pants", "jeans pants", "👖"]
    takeable: true
    wearable: true
    owner: bernie
    size: 2
    contents: [bernie_jeans_pants_pocket]
    description:
      en: |
        A pair of men's slim straight-leg jeans in dark wash. They have a comfortable fit and are made of durable denim fabric.
      conditions:
        - if: "containerHas(bernie_jeans_pants, bernie_jeans_pants_pocket) and current_player_actor != 'bernie'"
          message:
            en: |
              You can see the outline of Bernie's credit card in the back pocket of his jeans.
    images: ["images/items/tti-2026-05-31T17-37-47-474329566.png"]

  # -------------------------------
  # Location Items
  # -------------------------------

  # Living Room
  living_room_couch:
    name:
      en: |
        Living Room Couch
    short_name:
      en: |
        couch
    synonyms:
      en: ["couch", "sofa", "living room sofa"]
    takeable: false
    sittable: true
    sleepable: true
    actor_capacity: 3
    container_capacity: 10
    description:
      en: |
        A large sectional sofa that provides a comfortable seating area for guests. It is made of soft, plush fabric in a neutral color, complementing the modern decor of the living room. The couch has deep cushions and wide armrests, making it an inviting spot to relax and enjoy the stunning view of the city through the floor-to-ceiling windows.

  living_room_coffee_table:
    name:
      en: |
        Living Room Coffee Table
    short_name:
      en: |
        coffee table
    synonyms:
      en: ["coffee table", "table", "living room table"]
    takeable: false
    sittable: true
    container_type: on
    container_capacity: 4
    actor_capacity: 1
    description:
      en: |
        A contemporary coffee table at the center of the living room, holding a few art books and a decorative vase. The table has a sleek design with a glass top and metal legs, adding a touch of sophistication to the space.

  living_room_bar_cart:
    name:
      en: |
        Living Room Bar Cart
    short_name:
      en: |
        bar cart
    synonyms:
      en: ["bar cart", "cart", "living room cart"]
    takeable: false
    container_type: on
    container_capacity: 6
    description:
      en: |
        A stylish bar cart in the living room, stocked with an assortment of spirits and glassware, ready for entertaining. The bar cart has a modern design with a metal frame and glass shelves, providing a functional and attractive way to display and serve drinks for guests.

  # Hallway - Half Bathroom
  half_bathroom_door:
    name:
      en: |
        Half Bathroom Door
    short_name:
      en: |
        half bathroom door
    synonyms:
      en: ["door", "half bathroom door", "bathroom door"]
    openable:
      initial: closed
      lockable: true
      locked: true
      side: one_way
      accessible_from:
        - penthouse_hallway_half_bathroom
      show_current_state: true
    description:
      en: |
        A sleek wooden door that leads to the half bathroom. It has a modern design that fits the overall aesthetic of the penthouse, providing privacy and access to the bathroom facilities.

  half_bathroom_toilet:
    name:
      en: |
        Half Bathroom Toilet
    short_name:
      en: |
        toilet
    synonyms:
      en: ["toilet", "bathroom toilet"]
    takeable: false
    sittable: true
    actor_capacity: 1
    container_type: in
    container_capacity: 1
    description:
      en: |
        A modern toilet in the half bathroom, designed for convenience and comfort. Next to it is a toilet paper roll holder for easy access to toilet paper.
  
  half_bathroom_toilet_water:
    name:
      en: |
        Half Bathroom Toilet Water
    short_name:
      en: |
        toilet water
    synonyms:
      en: ["toilet water", "water"]
    takeable: false
    container_type: in
    description:
      en: |
        Clean water in the half bathroom toilet, ready for use.

  half_bathroom_toilet_paper_roll_holder:
    name:
      en: |
        Half Bathroom Toilet Paper Roll Holder
    short_name:
      en: |
        toilet roll holder
    synonyms:
      en: ["toilet paper roll holder", "toilet paper holder", "paper roll holder", "holder"]
    takeable: false
    container_type: hanging
    container_capacity: 1
    contents: [half_bathroom_toilet_paper_roll]
    description:
      en: |
        A simple and functional toilet paper roll holder mounted on the wall next to the toilet in the half bathroom.
      conditions:
        - if: "containerHas(half_bathroom_toilet_paper_roll_holder, half_bathroom_toilet_paper_roll)"
          message:
            en: |
              Currently holding a roll of toilet paper.

  half_bathroom_sink:
    name:
      en: |
        Half Bathroom Sink
    short_name:
      en: |
        sink
    synonyms:
      en: ["sink", "bathroom sink"]
    takeable: false
    container_type: attached
    contents: [half_bathroom_faucet]
    container_capacity: 1
    description:
      en: |
        A sleek and stylish sink in the half bathroom, perfect for washing hands and freshening up.

  half_bathroom_sink_water:
    name:
      en: |
        Half Bathroom Sink Water
    short_name:
      en: |
        sink water
    synonyms:
      en: ["sink water", "water"]
    takeable: false
    container_type: in
    description:
      en: |
        Clean water in the half bathroom sink, ready for use.

  half_bathroom_faucet:
    name:
      en: |
        Half Bathroom Faucet
    short_name:
      en: |
        faucet
    synonyms:
      en: ["faucet", "sink faucet", "bathroom faucet"]
    takeable: false
    openable: true
    description:
      en: |
        A modern faucet mounted on the half bathroom sink, providing a convenient water source for washing hands and face.

  half_bathroom_toilet_paper_roll:
    name:
      en: |
        Toilet Paper Roll
    short_name:
      en: |
        toilet paper roll
    synonyms:
      en: ["toilet paper roll", "toilet paper", "paper roll", "paper"]
    takeable: true
    size: 1
    description:
      en: |
        A simple roll of toilet paper.
    images: ["images/items/tti-2026-06-01T21-04-48-419940349.png"]

  # Guest Bedroom
  guest_bedroom_door:
    name:
      en: |
        Guest Bedroom Door
    short_name:
      en: |
        guest bedroom door
    synonyms:
      en: ["door", "guest bedroom door", "bedroom door"]
    openable:
      initial: closed
      lockable: true
      locked: false
      side: one_way
      accessible_from:
        - penthouse_guest_bedroom
      show_current_state: true
    description:
      en: |
        A sturdy wooden door that leads to the guest bedroom. It has a sleek design that complements the modern aesthetic of the penthouse, providing privacy and security for guests staying in the guest bedroom.

  guest_bedroom_bed:
    name:
      en: |
        Guest Bedroom Bed
    short_name:
      en: |
        bed
    synonyms:
      en: ["bed", "guest bed", "bedroom bed"]
    takeable: false
    sittable: true
    sleepable: true
    actor_capacity: 3
    container_capacity: 10
    description:
      en: |
        A comfortable queen-sized bed in the guest bedroom, perfect for accommodating visitors. The bed is adorned with soft linens and decorative pillows, creating a cozy and inviting sleeping area for guests staying in the penthouse.

  # Master Bedroom
  master_bedroom_door:
    name:
      en: |
        Master Bedroom Door
    short_name:
      en: |
        master bedroom door
    synonyms:
      en: ["door", "bedroom door"]
    openable:
      initial: closed
      lockable: true
      locked: false
      side: one_way
      accessible_from:
        - penthouse_master_bedroom
      show_current_state: true
    description:
      en: |
        A sturdy wooden door that leads to the master bedroom. It has a sleek design that complements the modern aesthetic of the penthouse, providing privacy and security for the occupants of the master bedroom.
  
  master_bedroom_bed:
    name:
      en: |
        Master Bedroom Bed
    short_name:
      en: |
        bed
    synonyms:
      en: ["bed", "master bed", "bedroom bed"]
    takeable: false
    sittable: true
    sleepable: true
    actor_capacity: 4
    container_capacity: 10
    description:
      en: |
        A luxurious king-sized bed with a plush headboard and high-quality linens. The bed is adorned with decorative pillows and a cozy duvet, creating an inviting and comfortable sleeping area in the master bedroom of the penthouse.
  
  # Master Ensuite
  master_ensuite_bathtub:
    name:
      en: |
        Master Ensuite Bathtub
    short_name:
      en: |
        bathtub
    synonyms:
      en: ["bathtub", "tub", "master tub"]
    takeable: false
    enterable: true
    sittable: true
    container_type: in
    actor_capacity: 2
    container_capacity: 10
    description:
      en: |
        A luxurious bathtub in the master ensuite, perfect for a relaxing soak.
  
  master_ensuite_shower:
    name:
      en: |
        Master Ensuite Shower
    short_name:
      en: |
        shower
    synonyms:
      en: ["shower", "master shower"]
    takeable: false
    enterable: true
    actor_capacity: 3
    container_capacity: 10
    description:
      en: |
        A spacious and modern shower in the master ensuite, featuring sleek glass doors and high-end fixtures for a refreshing bathing experience.