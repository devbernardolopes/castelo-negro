    description:
      en: |
        A paperback copy of the first part of the romance novel "My Rival, My Love". The book has a colorful cover featuring an illustration of a romantic scene between two characters, hinting at the passionate and dramatic story contained within its pages.
    images: ["images/items/tti-2026-06-04T16-40-29-813343294.png"]

  living_room_coffee_table:
