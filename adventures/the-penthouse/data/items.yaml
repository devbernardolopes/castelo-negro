      en: |
        A pair of simple white leggings made of stretchy fabric, providing a comfortable and versatile option for casual wear or lounging at home.
    images: ["images/items/tti-2026-06-04T15-07-46-103774258.png"]

  anya_white_sneakers:
    name:
      en: |
        {owner}'s White Sneakers
    short_name:
      en: |
        white sneakers
    synonyms:
      en: ["white sneakers", "sneakers", "shoes", "anya's sneakers"]
    takeable: true
    wearable: true
    owner: anya
    size: 1
    description:
      en: |
        A pair of classic white sneakers with a clean and minimalist design, perfect for everyday wear and providing a comfortable fit for various activities.
    images: ["images/items/tti-2026-06-04T15-10-02-821735076.png"]

  anya_black_cropped_sweater:
    name:
      en: |
        {owner}'s Black Cropped Sweater
    short_name:
      en: |
        black cropped sweater
    synonyms:
      en: ["black cropped sweater", "cropped sweater", "sweater", "anya's sweater"]
    takeable: true
    wearable: true
    owner: anya
    size: 1
    description:
      en: |
        A stylish black cropped sweater with a relaxed fit and a soft, cozy fabric, perfect for layering and adding a touch of casual chic to any outfit.
    images: ["images/items/tti-2026-06-04T15-12-43-419871339.png"]

  # -------------------------------
  # Sabine's Items
  # -------------------------------
  sabine_cell_phone:
    name:
      en: |
        {owner}'s Cell Phone
    synonyms:
      en: ["cell phone", "phone", "sabine's phone"]
    takeable: true
    owner: sabine
    size: 1
    description:
      en: |
        A sleek smartphone.
    images: ["images/items/tti-2026-05-31T17-49-06-403406110.png"]

  sabine_jeans_pants_pocket:
    name:
      en: |
        Sabine's Jeans Pants Pocket
    short_name:
      en: |
        front pocket
    synonyms:
      en: ["pocket", "sabine's pocket", "jeans pocket", "pants pocket", "sabine's jeans pocket", "sabine's pants pocket"]
    contents: [sabine_cell_phone]
    show_in_inventory: false
    container_capacity: 1
    description:
      en: |
        The front pocket of Sabine's jeans pants.
      conditions:
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor != 'sabine'"
          message:
            en: |
              You can see the outline of Sabine's cell phone.
        - if: "containerHas('sabine_jeans_pants_pocket', 'sabine_cell_phone') and current_player_actor == 'sabine'"
          message:
            en: |
              You can see the outline of your cell phone.

  sabine_jeans_pants:
    name:
      en: |
        {owner}'s Jeans Pants
    short_name:
      en: |
        jeans
    synonyms:
      en: ["jeans", "pants", "sabine's jeans", "sabine's pants"]
    takeable: true
    wearable: true
    owner: sabine
    size: 2
    contents: [sabine_jeans_pants_pocket]
    description:
      en: |
        A pair of women's stylish skinny jeans in indigo blue color. They have a high waist and a slim fit, accentuating the wearer's figure. The jeans feature classic five-pocket styling, with two front pockets, two back pockets, and a small coin pocket on the right side. The front pockets are adorned with silver rivets for added durability and style. The jeans are made of a stretchy denim fabric that provides comfort and flexibility for all-day wear. The waistband has belt loops, allowing for accessorizing with a belt if desired. Overall, these jeans are a fashionable and versatile addition to any wardrobe.
    images: ["images/items/tti-2026-05-31T17-42-03-25590608.png"]
  
  sabine_tank_top:
    name:
      en: |
        {owner}'s Tank Top
    short_name:
      en: |
        tank top
    synonyms:
      en: ["tank top", "top", "sabine's tank top"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A simple women's white tank top made of soft cotton fabric. It has a classic design with a scoop neckline and thin shoulder straps, providing a comfortable and breathable fit for warm weather. The tank top is versatile and can be easily paired with various bottoms, making it a staple piece in any woman's wardrobe.
    images: ["images/items/tti-2026-06-01T21-28-28-176196360.png"]

  sabine_silver_strappy_sandals:
    name:
      en: |
        {owner}'s Silver Strappy Sandals
    short_name:
      en: |
        silver strappy sandals
    synonyms:
      en: ["silver strappy sandals", "sandals", "shoes", "sabine's sandals"]
    takeable: true
    wearable: true
    owner: sabine
    size: 1
    description:
      en: |
        A pair of elegant silver strappy sandals with a low heel. The sandals feature thin straps that crisscross over the foot and secure with a small buckle at the ankle, providing a stylish and comfortable fit. The silver color adds a touch of glamour, making these sandals perfect for dressing up any outfit for a night out or special occasion.
    images: ["images/items/tti-2026-06-01T21-32-12-288403318.png"]

  # -------------------------------
  # Bernie's Items
  # -------------------------------
  bernie_credit_card:
    name:
      # Previously: Bernie's Credit Card
      # Review if the possessive form is necessary or if "Bernie's" can be omitted since the owner is already specified in the item definition.
      en: |
        {owner}'s Credit Card
    synonyms:
      en: ["credit card", "card", "bernie's card"]
    takeable: true
    owner: bernie
    size: 1
    description:
      en: |
        A credit card with Bernie's name on it.
    images: ["images/items/tti-2026-05-31T17-45-10-875944803.png"]

  bernie_jeans_pants_pocket:
    name:
      en: |
        Bernie's Jeans Pants Pocket
    short_name:
      en: |
        back pocket
    synonyms:
      en: ["pocket", "bernie's pocket", "jeans pocket", "pants pocket", "bernie's jeans pocket", "bernie's pants pocket"]
    contents: [bernie_credit_card]
    container_capacity: 1
    show_in_inventory: false
    description:
      en: |
        The back pocket of Bernie's jeans pants.
  
  bernie_jeans_pants:
    name:
      en: |
        {owner}'s Jeans Pants
    short_name:
      en: |
        jeans
    synonyms:
      en: ["jeans", "pants", "bernie's jeans", "bernie's pants", "jeans pants", "👖"]
    takeable: true
    wearable: true
    owner: bernie
    size: 2
    contents: [bernie_jeans_pants_pocket]
    description:
      en: |
        A pair of men's slim straight-leg jeans in dark wash. They have a comfortable fit and are made of durable denim fabric.
      conditions:
        - if: "containerHas(bernie_jeans_pants, bernie_jeans_pants_pocket) and current_player_actor != 'bernie'"
          message:
            en: |
              You can see the outline of Bernie's credit card in the back pocket of his jeans.
    images: ["images/items/tti-2026-05-31T17-37-47-474329566.png"]

  # -------------------------------
  # Location Items
  # -------------------------------

  # Entrance
  elevator_cabin:
    name:
      en: |
        Elevator Cabin
    short_name:
      en: |
        elevator cabin
    synonyms:
      en: ["elevator cabin", "cabin", "elevator"]
    enterable: true
    sittable: true
    actor_capacity: 6
    openable:
      initial: closed
      lockable: false
      locked: false
      # side: one_way
      # accessible_from:
      #   - penthouse_hallway_half_bathroom
      show_current_state: true
    container_type: attached
    contents: [elevator_control_panel]
    description:
      en: |
        A sleek and modern elevator cabin with a polished metal interior and a control panel with buttons for each floor. The cabin is spacious enough to comfortably accommodate several people, making it a convenient way to access the different levels of the penthouse.

  elevator_control_panel:
    name:
      en: |
        Elevator Control Panel
    short_name:
      en: |
        elevator control panel
    synonyms:
      en: ["elevator control panel", "control panel", "elevator buttons"]
    container_type: attached
    contents: [elevator_control_panel_button_lobby, elevator_control_panel_button_penthouse, elevator_control_panel_button_terrace]
    description:
      en: |
        A sleek control panel located inside the elevator cabin, featuring buttons for each floor of the penthouse. The control panel allows you to easily select your desired floor and access the various levels of the penthouse with ease.

  elevator_control_panel_button_lobby:
    name:
      en: |
        Elevator Control Panel Button - Lobby
    short_name:
      en: |
        lobby button
    synonyms:
      en: ["lobby button", "elevator button", "button"]
    contents: []
    description:
      en: |
        A button on the elevator control panel that allows you to select the lobby floor. Pressing this button will signal the elevator to take you directly to the lobby level, providing convenient access to the main entrance and common areas of the building.

  elevator_control_panel_button_penthouse:
    name:
      en: |
        Elevator Control Panel Button - Penthouse
    short_name:
      en: |
        penthouse button
    synonyms:
      en: ["penthouse button", "elevator button", "button"]
    contents: []
    description:
      en: |
        A button on the elevator control panel that allows you to select the penthouse floor. Pressing this button will signal the elevator to take you directly to the penthouse level, providing convenient access to the luxurious living space.

  elevator_control_panel_button_terrace:
    name:
      en: |
        Elevator Control Panel Button - Terrace
    short_name:
      en: |
        terrace button
    synonyms:
      en: ["terrace button", "elevator button", "button"]
    contents: []
    description:
      en: |
        A button on the elevator control panel that allows you to select the terrace floor. Pressing this button will signal the elevator to take you directly to the terrace level, providing convenient access to the outdoor space with stunning views of the city.

  elevator_call_button:
    name:
      en: |
        Elevator Call Button
    short_name:
      en: |
        elevator call button
    synonyms:
      en: ["elevator call button", "call button", "elevator button"]
    contents: []
    description:
      en: |
        A button located near the entrance of the penthouse that allows you to call the elevator to your current floor. Pressing the button will signal the elevator to arrive, providing a convenient way to access the different levels of the penthouse.

  # Living Room
