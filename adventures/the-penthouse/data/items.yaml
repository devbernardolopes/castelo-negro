    container_capacity: 4
    actor_capacity: 1
    contents: [tv_remote_control, my_rival_my_love_part_1_book]
    description:
      en: |
        A contemporary coffee table at the center of the living room, holding a few books and a decorative vase. The table has a sleek design with a glass top and metal legs, adding a touch of sophistication to the space.

  living_room_bar_cart:
