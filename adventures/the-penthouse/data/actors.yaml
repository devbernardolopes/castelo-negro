      health: 80
      amount_of_vacations: 0
    relationships:
      bernie:
        affinity: 52
        relationship_level: "acquaintances"
      sabine:
        affinity: -21
        relationship_level: "strangers"
    dialogue:
      entry_nodes:
        - id: friendly_greeting
          conditions:
            - "getRelationship(current_player_actor, 'dana', 'affinity') > 50"
        - id: neutral_greeting
          conditions: []
      nodes:
        friendly_greeting:
          message:
            en: "Bernie! Always good to see you."
          options:
            - text:
                en: "Good to see you too."
              effects:
                - "setRelationship(current_player_actor, 'dana', 'affinity', getRelationship('dana', 'affinity') + 3)"
              next: null
            - text:
                en: "See you around."
              next: null
        neutral_greeting:
          message:
            en: "Hey."
          options:
            - text:
                en: "Hey, Dana."
              effects:
                - "setRelationship(current_player_actor, 'dana', 'affinity', getRelationship('dana', 'affinity') + 1)"
              next: null
            - text:
                en: "..."
              next: null
