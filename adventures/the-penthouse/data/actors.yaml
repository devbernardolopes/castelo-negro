  sabine:
    name:
      en: |
        Sabine
    synonyms:
      en: ["sabine", "her", "girl", "woman", "female", "lady"]
    playable: true
    starting_location: penthouse_living_room
    known_locations: [penthouse_living_room]
    inventory: []
    starting_contained_by: living_room_couch
    wearing: [sabine_jeans_pants]
    max_capacity: 2
    properties:
      age: 23
      gender: "female"
      mood: "anxious"
      stamina: 75
      health: 80
      amount_of_vacations: 0
    relationships:
      bernie:
        affinity: 35
        relationship_level: "acquaintances"
      dana:
        affinity: -10
        relationship_level: "strangers"
    dialogue:
      entry_nodes:
        - id: greeting
          conditions: []
      nodes:
        greeting:
          message:
            en: "Hey, Bernie. I'm glad you're here. What's up?"
          options:
            - text:
                en: "How are you feeling?"
              next: feeling
            - text:
                en: "We should visit your brother in Brooklyn soon."
              next: brooklyn
            - text:
                en: "See you later."
              next: null
        feeling:
          message:
            en: "A bit anxious, honestly. Work has been piling up."
          options:
            - text:
                en: "Want to talk about it?"
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 3)"
              next: talk_about_work
            - text:
                en: "I'm sure you'll handle it."
              next: greeting
            - text:
                en: "See you later."
              next: null
        talk_about_work:
          message:
            en: "Thanks, Bernie. Just knowing you're around helps."
          options:
            - text:
                en: "Anytime, Sabine."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
            - text:
                en: "That's what friends are for."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
        brooklyn:
          message:
            en: "Oh, I'd love that! It's been too long."
          options:
            - text:
                en: "I'll text him."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
            - text:
                en: "Let's plan it for next weekend."
              next: greeting

  dana:
    name:
      en: |
        Dana
    synonyms:
