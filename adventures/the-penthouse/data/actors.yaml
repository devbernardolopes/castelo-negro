                en: "Want to talk about it?"
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 3)"
              next: talk_about_work
            - text:
                en: "I'm sure you'll handle it."
              next: greeting
            - text:
                en: "See you later."
              next: null
        talk_about_work:
          message:
            en: "Thanks, Bernie. Just knowing you're around helps."
          options:
            - text:
                en: "Anytime, Sabine."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
            - text:
                en: "That's what friends are for."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
        brooklyn:
          message:
            en: "Oh, I'd love that! It's been too long."
          options:
            - text:
                en: "I'll text him."
              effects:
                - "setRelationship(current_player_actor, 'sabine', 'affinity', getRelationship('sabine', 'affinity') + 5)"
              next: null
            - text:
                en: "Let's plan it for next weekend."
              next: greeting

