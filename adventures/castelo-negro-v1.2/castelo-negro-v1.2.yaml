metadata:
  title: Castelo Negro
  version: 1.5
  languages: [en, pt-br]
  default_language: en
  assets_path: "assets/"

variables:
  game_turn:
    type: int
    value: 0
    description: "Increments every player action"

  current_player_actor:
    type: object
    value: [protagonist]

  inventory:
    type: list
    value: []
    max_capacity: 4

  protagonist_memory:
    type: list
    value: []

  protagonist_memory_max_capacity:
    type: int
    value: 22
    min_value: 0

  newborn_daughter_health:
    type: int
    value: 3
    min_value: 0
    max_value: 3

  cottage_door_open:
    type: bool
    value: false
    description: "If true, the front door of the cottage is open, otherwise it is closed. This variable does not determine whether the door is locked or unlocked, only whether it is currently open or closed."

  cottage_door_locked:
    type: bool
    value: true
    description: "If true, the front door of the cottage is locked and by extension closed."

  player_health:
    type: int
    value: 10
    min_value: 0
    max_value: 10

  sanity:
    type: int
    value: 8
    min_value: 0
    max_value: 10

  has_met_hag:
    type: bool
    value: false

  time_of_day:
    type: string
    value: "night"
    possible_values: ["night", "dawn", "morning", "afternoon", "evening"]

  fed_baby: 
    type: bool
    value: false

  entered_castle:
    type: bool
    value: false

items:
  cottage_key:
    name: { en: "Cottage Key", pt-br: "Chave do Chalé" }
    synonyms: { en: ["brass key"], pt-br: ["chave de latão"] }
    takeable: true
    description: { en: "A tarnished brass key.", pt-br: "Uma chave de latão oxidada." }
    images: ["images/items/tti-2026-05-23T23-26-04-394045010.png"]

  hand_sickle:
    name: { en: "Hand Sickle", pt-br: "Foice de Mão" }
    synonyms: { en: ["sickle", "reap hook", "reaping hook"], pt-br: ["foice"] }
    takeable: true
    images: ["images/items/tti-2026-05-23T23-37-55-654889641.png"]
    description: { en: "A worn, curved sickle.", pt-br: "Uma foice desgastada e curvada." }

  husband_corpse:
    name: { en: "Husband's Corpse", pt-br: "Cadáver do Esposo" }
    takeable: false
    contents: [cottage_key]
    description: { en: "The body of your husband, cold and still.", pt-br: "O corpo do seu marido, frio e imóvel." }

  newborn_daughter:
    name: { en: "Newborn Daughter", pt-br: "Filha Recém-Nascida" }
    synonyms: { en: ["baby", "daughter", "infant"], pt-br: ["bebê", "filha"] }
    takeable: true
    description: { en: "Your tiny, crying daughter.", pt-br: "Sua pequena filha chorando." }
    images: ["images/items/tti-2026-05-24T02-23-25-446674314.png"]

  moldy_loaf_of_bread:
    name: { en: "Moldy Loaf of Bread", pt-br: "Pão Mofado" }
    synonyms: { en: ["bread", "loaf of bread", "moldy bread", "moldy loaf", "loaf of moldy bread"], pt-br: ["pão", "pão mofado", "pedaço de pão mofado", "pedaço de pão"] }
    takeable: true
    consumable: true
    description: { en: "A small, mold-covered loaf.", pt-br: "Um pequeno pedaço de pão mofado." }
    images: ["images/items/tti-2026-05-23T23-26-32-610649206.png"]

  cottage_front_door:
    name: { en: "Cottage Front Door", pt-br: "Porta da Frente do Chalé" }
    synonyms: { en: ["front door", "door"], pt-br: ["porta da frente", "porta"] }
    takeable: false
    description: { en: "The sturdy front door of your cottage.", pt-br: "A porta da frente do seu chalé." }

locations:
  cottage_living_room:
    name: { en: "Cottage - Living Room", pt-br: "Chalé - Sala de Estar" }
    description:
      base: { en: "You're in the living room of your modest cottage.", pt-br: "Você está na sala de estar do seu modesto chalé." }
      conditions:
        - if: "!inventory.has(newborn_daughter)"
          text: { en: "You can hear your [baby] crying desperately on the floor.", pt-br: "Você pode ouvir sua [bebê] chorando desesperadamente no chão." }
        - if: "cottage_door_open"
          text: { en: "The [front door] stands wide open, letting cold air in.", pt-br: "A [porta da frente] está escancarada, deixando o ar frio entrar." }
        - if: "!cottage_door_open"
          text: { en: "The [front door] stands closed.", pt-br: "A [porta da frente] está fechada." }
    contents: [husband_corpse, newborn_daughter, cottage_front_door]
    exits:
      north: cottage_kitchen
      west:
        location: cottage_porch
        conditions:
          - if: "cottage_door_locked"
            allow: false
            message: { en: "The front door is locked. You can't go outside.", pt-br: "A porta da frente está trancada. Você não pode sair." }
          - if: "!cottage_door_locked and !cottage_door_open"
            allow: false
            message: { en: "The front door is closed. You need to open it first.", pt-br: "A porta da frente está fechada. Você precisa abri-la primeiro." }
          - if: "!cottage_door_locked and cottage_door_open"
            allow: true
    images: ["images/locations/tti-2026-05-21T21-51-48-934644704.png"]

  cottage_kitchen:
    name: { en: "Cottage - Kitchen", pt-br: "Chalé - Cozinha" }
    description:
      base: { en: "A simple kitchen with a stone hearth.", pt-br: "Uma cozinha simples com uma lareira de pedra." }
    contents: [moldy_loaf_of_bread]
    exits:
      south: cottage_living_room
    images: ["images/locations/tti-2026-05-21T22-20-09-116212.png"]

  cottage_porch:
    name: { en: "Cottage - Porch", pt-br: "Chalé - Varanda" }
    description:
      base: { en: "The wooden porch creaks under your feet.", pt-br: "A varanda de madeira range sob seus pés." }
    exits:
      north: path_to_crop_fields
      east: cottage_living_room
    images: ["images/locations/tti-2026-05-21T21-50-11-148199714.png"]

  path_to_crop_fields:
    name: { en: "Path to Crop Fields", pt-br: "Caminho para os Campos de Cultivo" }
    description:
      base: { en: "A dirt path leads toward the fields.", pt-br: "Um caminho de terra leva aos campos." }
    exits:
      north: crop_fields
      south: cottage_porch
    images: ["images/locations/tti-2026-05-21T21-42-06-488414966.png"]

  crop_fields:
    name: { en: "Crop Fields", pt-br: "Campos de Cultivo" }
    description:
      base: { en: "Wilted crops sway in the cold wind.", pt-br: "Culturas murchas balançam ao vento frio." }
    exits:
      south: path_to_crop_fields
    images: ["images/locations/tti-2026-05-21T21-40-35-613533080.png"]

  black_castle_ensuite:
    name: { en: "Black Castle - Ensuite", pt-br: "Castelo Negro - Banheiro Privativo" }
    description:
      base: { en: "A dark, opulent bathroom inside the Black Castle.", pt-br: "Um banheiro escuro e opulento dentro do Castelo Negro." }
    contents: [old_hag]
    exits: {}
    images: ["images/locations/tti-2026-05-21T23-57-11-633718448.png"]

actors:
  protagonist:
    name: { en: "You", pt-br: "Você" }
    playable: true
    starting_location: cottage_living_room
    memory:
      words_variable: protagonist_memory
      max_capacity_variable: protagonist_memory_max_capacity

  old_hag:
    name: { en: "Old Hag", pt-br: "Velha Bruxa" }
    playable: false
    starting_location: black_castle_ensuite
    dialogue:
      default:
        en: "Hehehe... what a delicious little family you have..."
        pt-br: "Hehehe... que família deliciosa você tem..."

events:
  - id: baby_cries
    type: recurring
    interval: 3
    conditions:
      - "newborn_daughter_health > 0"
      - "!inventory.has(newborn_daughter)"
    effect:
      - "sanity -= 1"
    message:
      en: "Your daughter's cries echo painfully in your mind."
      pt-br: "Os choros da sua filha ecoam dolorosamente em sua mente."

  - id: baby_health_decay
    type: recurring
    interval: 5
    conditions: ["newborn_daughter_health > 0"]
    effect: "newborn_daughter_health -= 1"
    message:
      en: "Your daughter is getting weaker..."
      pt-br: "Sua filha está enfraquecendo..."

  - id: night_to_dawn
    type: time_based
    trigger_when: "game_turn >= 8"
    effect: "time_of_day = 'dawn'"
    message:
      en: "The sky begins to lighten in the east."
      pt-br: "O céu começa a clarear no leste."

  - id: hag_encounter
    type: location_enter
    location: "black_castle_ensuite"
    conditions: ["!has_met_hag"]
    effect: "has_met_hag = true"
    message:
      en: "An old hag emerges from the shadows, grinning with rotten teeth."
      pt-br: "Uma velha bruxa surge das sombras, sorrindo com dentes podres."

end_conditions:
  lose:
    - id: baby_dead
      condition: "newborn_daughter_health <= 0"
      message:
        en: "Your daughter has died in your arms. Overwhelmed by grief, you lose all will to continue..."
        pt-br: "Sua filha morreu em seus braços. Dominado pela dor, você perde toda a vontade de continuar..."
      final_image: "death_baby.png"

    - id: player_dead
      condition: "player_health <= 0 or sanity <= 0"
      message:
        en: "Darkness takes you. You collapse, never to wake again."
        pt-br: "A escuridão te toma. Você desaba, sem nunca mais acordar."
      final_image: "death_player.png"

    - id: starvation
      condition: "game_turn >= 30 and player_health <= 3"
      message:
        en: "Hunger and despair finally consume you."
        pt-br: "Fome e desespero finalmente te consomem."

  win:
    - id: reach_sanctuary
      condition: "current_location == 'black_castle_ensuite' and newborn_daughter_health >= 2 and has_met_hag"
      message:
        en: "The hag reveals a hidden ritual that saves your daughter... at a terrible cost."
        pt-br: "A bruxa revela um ritual oculto que salva sua filha... a um custo terrível."
      final_image: "ending_true.png"

    - id: escape_with_baby
      condition: "current_location == 'crop_fields' and inventory.has(newborn_daughter) and newborn_daughter_health >= 1"
      message:
        en: "You flee into the night with your daughter. Survival is uncertain, but you are free."
        pt-br: "Você foge noite adentro com sua filha. A sobrevivência é incerta, mas vocês estão livres."

strings:
  intro:
    en: |
      Too weak... starving...
      	
      You can't [take] it anymore. Your body starts to [give] out.

      You [drop] to your knees, clutching your crying daughter.
      
      You collapse.
      
      ...
      
      You wake up.
      
      Not dead. Not yet.
    pt-br: |
      Muito fraca... morrendo de fome...

      Você não aguenta mais. Seu corpo começa a falhar.

      Você [pega] sua filha chorando e se agarra a ela.
      
      Você desaba.
      
      ...
      
      Você acorda.

      Não morta. Ainda não.
      
  death_baby: { en: "Your daughter stopped breathing...", pt-br: "Sua filha parou de respirar..." }
  
  death_player: { en: "You collapse from exhaustion and despair.", pt-br: "Você desaba de exaustão e desespero." }

verbs:
  take:
    synonyms: { en: ["take", "pick up", "grab"], pt-br: ["pegar", "apanhar"] }
  give:
    synonyms: { en: ["give", "feed", "hand"], pt-br: ["dar", "alimentar"] }
  examine:
    synonyms: { en: ["examine", "look at", "inspect", "look"], pt-br: ["examinar", "olhar"] }
  drop:
    synonyms: { en: ["drop", "put down"], pt-br: ["soltar", "colocar"] }
  use:
    synonyms: { en: ["use"], pt-br: ["usar"] }
  unlock:
    synonyms: { en: ["unlock"], pt-br: ["destrancar"] }
  lock:
    synonyms: { en: ["lock"], pt-br: ["trancar"] }
  open:
    synonyms: { en: ["open"], pt-br: ["abrir"] }
  close:
    synonyms: { en: ["close"], pt-br: ["fechar"] }

actions:
  unlock_cottage_front_door:
    pattern:
      - verb: ["unlock"]
      - object: ["cottage_key"]
      - target: ["cottage_front_door"]
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_door_locked"
      - "inventory.has('cottage_key')"
    effect:
      - "cottage_door_locked = false"
    message:
      en: "You unlock the front door."
      pt-br: "Você destranca a porta da frente."

    # Failure branches - evaluated in order, first match wins
    conditional_messages:
      - condition: "!here.has('cottage_front_door')"
        message:
          en: "There's no front door here."
          pt-br: "Não há porta aqui."
      
      - condition: "!inventory.has('cottage_key')"
        message:
          en: "You don't have a key."
          pt-br: "Você não tem uma chave."
      
      - condition: "!cottage_door_locked"
        message:
          en: "The door is already unlocked."
          pt-br: "A porta já está destrancada."

  lock_cottage_front_door:
    pattern:
      - verb: ["lock"]
      - object: ["cottage_key"]
      - target: ["cottage_front_door"]
    conditions:
      - "here.has('cottage_front_door')"
      - "!cottage_door_open"
      - "inventory.has('cottage_key')"
    effect:
      - "cottage_door_locked = true"
    message:
      en: "You lock the front door."
      pt-br: "Você tranca a porta da frente."

  feed_newborn_daughter:
    pattern:
      - verb: ["give"]
      - object: ["moldy_loaf_of_bread"]
      - target: ["newborn_daughter"]
    conditions:
      - "inventory.has('moldy_loaf_of_bread')"
      - "inventory.has('newborn_daughter') or here.has('newborn_daughter')"
    effect:
      - "fed_baby = true"
      - "newborn_daughter_health += 2"
    message:
      en: "You break off a piece and feed your daughter."
      pt-br: "Você quebra um pedaço e alimenta sua filha."

  take_item:
    pattern:
      - verb: ["take"]
      - object: ["*"]
    conditions:
      - "items.takeable('{object}')"
      - "here.has('{object}')"
      - "inventory.length < inventory.max_capacity"
      - "!inventory.has('{object}')"
    effect: "inventory.add('{object}')"
    message:
      en: "You take the {object_name}."
      pt-br: "Você pega o {object_name}."

    # Failure branches - evaluated in order, first match wins
    conditional_messages:
      - condition: "!here.has('{object}')"
        message:
          en: "There's no {object_name} here."
          pt-br: "Não há {object_name} aqui."
      
      - condition: "!items.takeable('{object}')"
        message:
          en: "You can't take the {object_name}."
          pt-br: "Você não pode pegar o {object_name}."
      
      - condition: "inventory.length >= inventory.max_capacity"
        message:
          en: "You can't carry any more items."
          pt-br: "Você não pode carregar mais itens."

      - condition: "inventory.has('{object}')"
        message:
          en: "You already have the {object_name}."
          pt-br: "Você já tem o {object_name}."