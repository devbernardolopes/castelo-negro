metadata:
  title: Castelo Negro
  version: 1.9
  languages: [en, pt-br]
  default_language: en
  assets_path: "assets/"
  data_path: "data/"
  data_files: ["actors.yaml", "strings.yaml", "variables.yaml", "verbs.yaml"]
  allow_direct_input: false
  debug: true

items:
  cottage_key:
    name: { en: "Cottage Key", pt-br: "Chave do Chalé" }
    synonyms: { en: ["brass key", "key", "cottage key"], pt-br: ["chave de latão", "chave", "chave do chalé"] }
    takeable: true
    description: { en: "A tarnished brass key.", pt-br: "Uma chave de latão oxidada." }
    images: ["images/items/tti-2026-05-23T23-26-04-394045010.png"]

  hand_sickle:
    name: { en: "Hand Sickle", pt-br: "Foice de Mão" }
    synonyms: { en: ["sickle", "reap hook", "reaping hook"], pt-br: ["foice"] }
    takeable: true
    images: ["images/items/tti-2026-05-23T23-37-55-654889641.png"]
    description: { en: "A worn, curved sickle.", pt-br: "Uma foice desgastada e curvada." }

  husband_corpse:
    name: { en: "Husband's Corpse", pt-br: "Cadáver do Esposo" }
    synonyms: { en: ["husband", "corpse", "body"], pt-br: ["marido", "cadáver", "corpo"] }
    takeable: false
    contents: [husband_belt, hand_sickle]
    description: { en: "The body of your husband, cold and still.", pt-br: "O corpo do seu marido, frio e imóvel." }
    contents_visibility:
      husband_belt:
        visible_when: "husband_belt_visible"

  husband_belt:
    name: { en: "Husband's Belt", pt-br: "Cinto do Esposo" }
    synonyms: { en: ["belt", "husband's belt"], pt-br: ["cinto", "cinto do marido"] }
    takeable: false
    contents: [cottage_key]
    description: { en: "The belt of your husband, worn and torn.", pt-br: "O cinto do seu marido, desgastado e rasgado." }
    contents_visibility:
      cottage_key:
        visible_when: "husband_corpse_rolled"
  
  newborn_daughter:
    name: { en: "Newborn Daughter", pt-br: "Filha Recém-Nascida" }
    synonyms: { en: ["baby", "daughter", "infant", "newborn"], pt-br: ["bebê", "filha", "criança", "recém-nascida"] }
    takeable: true
    description: { en: "Your tiny, crying daughter.", pt-br: "Sua pequena filha chorando." }
    images: ["images/items/tti-2026-05-24T02-23-25-446674314.png"]

  cottage_kitchen_table:
    name: { en: "Kitchen Table", pt-br: "Mesa da Cozinha" }
    synonyms: { en: ["table", "kitchen table"], pt-br: ["mesa", "mesa da cozinha"] }
    takeable: false
    contents: [moldy_loaf_of_bread]
    description:
      base:
        en: |
          A small, worn wooden table.
        pt-br: |
          Uma pequena mesa de madeira desgastada.
      conditions:
        - if: "containerHas(cottage_kitchen_table, moldy_loaf_of_bread)"
          message: { en: "A small, mold-covered loaf lies on the table.", pt-br: "Um pequeno pedaço de pão mofado está sobre a mesa." }

  stone_hearth:
    name: { en: "Stone Hearth", pt-br: "Lareira de Pedra" }
    synonyms: { en: ["hearth", "stone hearth"], pt-br: ["lareira", "lareira de pedra"] }
    takeable: false
    contents: [charred_wood, hearth_ashes]
    description: { en: "A simple stone hearth for cooking and warmth.", pt-br: "Uma lareira de pedra simples para cozinhar e aquecer." }

  moldy_loaf_of_bread:
    name: { en: "Moldy Loaf of Bread", pt-br: "Pão Mofado" }
    synonyms: { en: ["bread", "loaf of bread", "moldy bread", "moldy loaf", "loaf of moldy bread", "loaf", "mold-covered loaf"], pt-br: ["pão", "pão mofado", "pedaço de pão mofado", "pedaço de pão"] }
    takeable: true
    consumable: true
    description: { en: "A small, mold-covered loaf.", pt-br: "Um pequeno pedaço de pão mofado." }
    images: ["images/items/tti-2026-05-23T23-26-32-610649206.png"]

  charred_wood:
    name: { en: "Charred Wood", pt-br: "Madeira Queimada" }
    synonyms: { en: ["charred wood"], pt-br: ["madeira queimada"] }
    takeable: true
    description: { en: "A piece of wood that has been burned.", pt-br: "Um pedaço de madeira que foi queimado." }
    images: ["images/items/tti-2026-05-25T22-56-49-992411015.png"]
  
  hearth_ashes:
    name: { en: "Hearth Ashes", pt-br: "Cinzas da Lareira" }
    synonyms: { en: ["hearth ashes", "ashes"], pt-br: ["cinzas da lareira", "cinzas"] }
    takeable: true
    description: { en: "Piles of ashes from the stone hearth.", pt-br: "Pilhas de cinzas da lareira de pedra." }
    images: ["images/items/tti-2026-05-25T23-26-53-1025784771.png"]

  cottage_front_door:
    name: { en: "Cottage Front Door", pt-br: "Porta da Frente do Chalé" }
    synonyms: { en: ["front door", "door"], pt-br: ["porta da frente", "porta"] }
    takeable: false
    description: { en: "The sturdy front door of your cottage.", pt-br: "A porta da frente do seu chalé." }

locations:
  cottage_living_room:
    name: { en: "Cottage - Living Room", pt-br: "Chalé - Sala de Estar" }
    synonyms: { en: ["living room", "room"], pt-br: ["sala de estar", "sala"] }
    description:
      base:
        en: |
          You're in the living room of your modest cottage.

          The kitchen lies right in front of you, while the porch to your left.
        pt-br: |
          Você está na sala de estar do seu modesto chalé.

          A cozinha fica bem na sua frente, enquanto a varanda fica à sua esquerda.
      conditions:
        - if: "here.has('husband_corpse')"
          message: { en: "Your husband lies on the floor, motionless.", pt-br: "Seu marido está no chão, imóvel." }
        - if: "!inventory.has(newborn_daughter)"
          message: { en: "You can hear your baby crying desperately on the floor.", pt-br: "Você pode ouvir sua bebê chorando desesperadamente no chão." }
    contents: [husband_corpse, newborn_daughter, cottage_front_door]
    exits:
      north: cottage_kitchen
      west:
        location: cottage_porch
        conditions:
          - if: "cottage_door_locked"
            allow: false
            message: { en: "The front door is locked. You can't go outside.", pt-br: "A porta da frente está trancada. Você não pode sair." }
          - if: "!cottage_door_locked and !cottage_door_open"
            allow: false
            message: { en: "The front door is closed. You need to open it first.", pt-br: "A porta da frente está fechada. Você precisa abri-la primeiro." }
          - if: "!cottage_door_locked and cottage_door_open"
            allow: true
    images: ["images/locations/tti-2026-05-21T21-51-48-934644704.png"]

  cottage_kitchen:
    name: { en: "Cottage - Kitchen", pt-br: "Chalé - Cozinha" }
    synonyms: { en: ["kitchen", "cottage kitchen"], pt-br: ["cozinha", "cozinha do chalé"] }
    description:
      base: { en: "A simple kitchen with a stone hearth.", pt-br: "Uma cozinha simples com uma lareira de pedra." }
      conditions:
        - if: "containerHas(cottage_kitchen_table, moldy_loaf_of_bread)"
          message: { en: "A small, mold-covered loaf lies on the kitchen table.", pt-br: "Um pequeno pedaço de pão mofado está sobre a mesa da cozinha." }
    contents: [cottage_kitchen_table, stone_hearth]
    exits:
      south: cottage_living_room
    images: ["images/locations/tti-2026-05-21T22-20-09-116212.png"]

  cottage_porch:
    name: { en: "Cottage - Porch", pt-br: "Chalé - Varanda" }
    description:
      base: { en: "The wooden porch creaks under your feet.", pt-br: "A varanda de madeira range sob seus pés." }
    exits:
      north: path_to_crop_fields
      east: cottage_living_room
    images: ["images/locations/tti-2026-05-21T21-50-11-148199714.png"]

  path_to_crop_fields:
    name: { en: "Path to Crop Fields", pt-br: "Caminho para os Campos de Cultivo" }
    description:
      base: { en: "A dirt path leads toward the fields.", pt-br: "Um caminho de terra leva aos campos." }
    exits:
      north: crop_fields
      south: cottage_porch
    images: ["images/locations/tti-2026-05-21T21-42-06-488414966.png"]

  crop_fields:
    name: { en: "Crop Fields", pt-br: "Campos de Cultivo" }
    description:
      base: { en: "Wilted crops sway in the cold wind.", pt-br: "Culturas murchas balançam ao vento frio." }
    exits:
      south: path_to_crop_fields
    images: ["images/locations/tti-2026-05-21T21-40-35-613533080.png"]

  path_to_black_castle_01:
    name: { en: "Path to Black Castle", pt-br: "Caminho para o Castelo Negro" }
    description:
      base: { en: "A dark, ominous black castle lies far away atop the hill.", pt-br: "Um castelo negro, escuro e ameaçador, ergue-se ao longe, no alto da colina." }
    exits:
      north: path_to_black_castle_02
    images: ["images/locations/tti-2026-05-26T01-42-37-213623111.png"]

  path_to_black_castle_02:
    name: { en: "Path to Black Castle", pt-br: "Caminho para o Castelo Negro" }
    description:
      base: { en: "A dark, ominous black castle lies ahead atop the hill.", pt-br: "Um castelo negro, escuro e ameaçador, ergue-se à frente, no alto da colina." }
    exits:
      north: black_castle
      south: path_to_black_castle_01
    images: ["images/locations/tti-2026-05-26T01-41-10-36840184.png"]

  black_castle:
    name: { en: "Black Castle", pt-br: "Castelo Negro" }
    description:
      base: { en: "A dark, ominous black castle.", pt-br: "Um castelo negro e sinistro." }
    exits:
      north: black_castle_entrance
      south: path_to_black_castle_02
    images: ["images/locations/tti-2026-05-26T01-32-00-798632562.png"]

  black_castle_entrance:
    name: { en: "Black Castle - Entrance", pt-br: "Castelo Negro - Entrada" }
    description:
      base: { en: "The entrance to the dark, ominous black castle.", pt-br: "A entrada do castelo negro e sinistro." }
    exits:
      south: black_castle
      north: black_castle_main_room
    images: ["images/locations/tti-2026-05-26T01-34-21-723276390.png"]

  black_castle_main_room:
    name: { en: "Black Castle - Main Room", pt-br: "Castelo Negro - Sala Principal" }
    description:
      base: { en: "The main room of the dark, ominous black castle.", pt-br: "A sala principal do castelo negro e sinistro." }
    exits:
      south: black_castle_entrance
    images: ["images/locations/tti-2026-05-26T01-56-29-138797493.png"]

  black_castle_ensuite:
    name: { en: "Black Castle - Ensuite", pt-br: "Castelo Negro - Banheiro Privativo" }
    description:
      base: { en: "A dark, opulent bathroom inside the Black Castle.", pt-br: "Um banheiro escuro e opulento dentro do Castelo Negro." }
    contents: [old_hag]
    exits: {}
    images: ["images/locations/tti-2026-05-21T23-57-11-633718448.png"]

events:
  - id: door_unlock_hint_level_1
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 0"
      - "cottage_door_unlock_attempted == false"
    effect:
      - "cottage_door_unlock_attempted = true"
      - "cottage_key_discovery_stage = 1"
    message:
      en: "You desperately try the locked door, but it won't budge. Where could the key be?"
      pt-br: "Você tenta desesperadamente a porta trancada, mas ela não se move. Onde poderia estar a chave?"

  - id: door_unlock_hint_level_2
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 1"
    message:
      en: "The door remains locked. Your husband... he must have had the key. It must still be on him."
      pt-br: "A porta continua trancada. Seu marido... ele deve ter tido a chave. Ela ainda deve estar com ele."

  - id: door_unlock_hint_level_3
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 2"
    message:
      en: "The door won't open. The key must be tied to his belt somehow..."
      pt-br: "A porta não abrirá. A chave deve estar amarrada ao seu cinto de alguma forma..."

  - id: door_unlock_no_hint_level_4
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage >= 3"
    message:
      en: "The door is locked. You have to find the key."
      pt-br: "A porta está trancada. Você precisa encontrar a chave."

