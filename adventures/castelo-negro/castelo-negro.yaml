metadata:
  title: Castelo Negro
  version: 1.1
  languages: [en, pt-br]
  default_language: en

variables:
  game_turn:
    type: int
    value: 0

  inventory:
    type: list
    value: []
    max_capacity: 4

  newborn_daughter_health:
    type: int
    value: 3
    min_value: 0
    max_value: 3

  cottage_door_open:
    type: bool
    value: false

  player_health:
    type: int
    value: 10
    min_value: 0
    max_value: 10

  sanity:
    type: int
    value: 8
    min_value: 0
    max_value: 10

  has_met_hag:
    type: bool
    value: false

items:
  cottage_key:
    name:
      en: "Cottage Key"
      pt-br: "Chave do Chalé"
    takeable: true
    consumable: false
    description:
      en: "A tarnished brass key."
      pt-br: "Uma chave de latão oxidada."
    verbs:
      use:
        conditions:
          - if: "current_location == 'cottage_living_room' or current_location == 'cottage_porch'"
            effect: "cottage_door_open = true"
            message:
              en: "You unlock the front door."
              pt-br: "Você destranca a porta da frente."

  husband_corpse:
    name:
      en: "Husband's Corpse"
      pt-br: "Cadáver do Esposo"
    takeable: false
    description:
      en: "The body of your husband, cold and still."
      pt-br: "O corpo do seu marido, frio e imóvel."

  newborn_daughter:
    name:
      en: "Newborn Daughter"
      pt-br: "Filha Recém-Nascida"
    takeable: true
    consumable: false
    description:
      en: "Your tiny, crying daughter."
      pt-br: "Sua pequena filha chorando."
    on_drop:
      effect: "newborn_daughter_health -= 1"
      message:
        en: "You gently place her down."
        pt-br: "Você a coloca no chão com cuidado."

  moldy_loaf_of_bread:
    name:
      en: "Moldy Loaf of Bread"
      pt-br: "Pão Mofado"
    takeable: true
    consumable: true
    description:
      en: "A small, mold-covered loaf."
      pt-br: "Um pequeno pedaço de pão mofado."
    on_consume:
      effect: "player_health += 1; newborn_daughter_health += 1 if inventory.has(newborn_daughter)"
      message:
        en: "The bread tastes awful, but it gives you some strength."
        pt-br: "O pão tem um gosto horrível, mas lhe dá um pouco de força."

locations:
  cottage_living_room:
    name:
      en: "Cottage - Living Room"
      pt-br: "Chalé - Sala de Estar"
    description:
      base:
        en: "You're in the living room of your modest cottage."
        pt-br: "Você está na sala de estar do seu modesto chalé."
      conditions:
        - if: "!inventory.has(newborn_daughter)"
          en: "You can hear your baby crying desperately on the floor."
          pt-br: "Você pode ouvir sua bebê chorando desesperadamente no chão."
        - if: "cottage_door_open"
          en: "The front door stands wide open, letting cold air in."
          pt-br: "A porta da frente está escancarada, deixando o ar frio entrar."
    contents:
      - husband_corpse
      - newborn_daughter
    exits:
      north: cottage_kitchen
      west: cottage_porch
    images:
      - "tti-2026-05-21T21-51-48-934644704.png"

  cottage_kitchen:
    name:
      en: "Cottage - Kitchen"
      pt-br: "Chalé - Cozinha"
    description:
      base:
        en: "A simple kitchen with a stone hearth."
        pt-br: "Uma cozinha simples com uma lareira de pedra."
    contents: []
    exits:
      south: cottage_living_room
    images:
      - "tti-2026-05-21T22-20-09-116212.png"

  cottage_porch:
    name:
      en: "Cottage - Porch"
      pt-br: "Chalé - Varanda"
    description:
      base:
        en: "The wooden porch creaks under your feet."
        pt-br: "A varanda de madeira range sob seus pés."
    exits:
      north: path_to_crop_fields
      east: cottage_living_room
    images:
      - "tti-2026-05-21T21-50-11-148199714.png"

  path_to_crop_fields:
    name:
      en: "Path to Crop Fields"
      pt-br: "Caminho para os Campos de Cultivo"
    description:
      base:
        en: "A dirt path leads toward the fields."
        pt-br: "Um caminho de terra leva aos campos."
    exits:
      north: crop_fields
      south: cottage_porch
    images:
      - "tti-2026-05-21T21-42-06-488414966.png"

  crop_fields:
    name:
      en: "Crop Fields"
      pt-br: "Campos de Cultivo"
    description:
      base:
        en: "Wilted crops sway in the cold wind."
        pt-br: "Culturas murchas balançam ao vento frio."
    exits:
      south: path_to_crop_fields
    images:
      - "tti-2026-05-21T21-40-35-613533080.png"

  black_castle_ensuite:
    name:
      en: "Black Castle - Ensuite"
      pt-br: "Castelo Negro - Banheiro Privativo"
    description:
      base:
        en: "A dark, opulent bathroom inside the Black Castle."
        pt-br: "Um banheiro escuro e opulento dentro do Castelo Negro."
    contents:
      - old_hag
    exits: {}
    images:
      - "tti-2026-05-21T23-57-11-633718448.png"

actors:
  protagonist:
    name:
      en: "You"
      pt-br: "Você"
    playable: true
    starting_location: cottage_living_room

  old_hag:
    name:
      en: "Old Hag"
      pt-br: "Velha Bruxa"
    playable: false
    starting_location: black_castle_ensuite
    dialogue:
      default:
        en: "Hehehe... what a delicious little family you have..."
        pt-br: "Hehehe... que família deliciosa você tem..."

strings:
  intro:
    en: |
      You wake up.
      You're in the living room of your cottage.
      Next to you is the deceased corpse of your husband.
      You can hear your infant daughter crying on the floor.
    pt-br: |
      Você acorda.
      Você está na sala de seu chalé.
      Ao seu lado jaz o cadáver de seu falecido marido.
      Você pode ouvir sua bebê chorando no chão.

  death_baby:
    en: "Your daughter stopped breathing..."
    pt-br: "Sua filha parou de respirar..."

  death_player:
    en: "You collapse from exhaustion and despair."
    pt-br: "Você desaba de exaustão e desespero."