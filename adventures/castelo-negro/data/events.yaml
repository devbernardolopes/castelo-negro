events:
  - id: door_unlock_hint_level_1
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 0"
      - "cottage_door_unlock_attempted == false"
    effect:
      - "cottage_door_unlock_attempted = true"
      - "cottage_key_discovery_stage = 1"
    message:
      en: "You desperately try the locked door, but it won't budge. Where could the key be?"
      pt-br: "Você tenta desesperadamente a porta trancada, mas ela não se move. Onde poderia estar a chave?"

  - id: door_unlock_hint_level_2
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 1"
    message:
      en: "The door remains locked. Your husband... he must have had the key. It must still be on him."
      pt-br: "A porta continua trancada. Seu marido... ele deve ter tido a chave. Ela ainda deve estar com ele."

  - id: door_unlock_hint_level_3
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage == 2"
    message:
      en: "The door won't open. The key must be tied to his belt somehow..."
      pt-br: "A porta não abrirá. A chave deve estar amarrada ao seu cinto de alguma forma..."

  - id: door_unlock_no_hint_level_4
    type: recurring
    trigger_on: "action_failed"
    action_id: "unlock_cottage_front_door"
    conditions:
      - "here.has('cottage_front_door')"
      - "cottage_key_discovery_stage >= 3"
    message:
      en: "The door is locked. You have to find the key."
      pt-br: "A porta está trancada. Você precisa encontrar a chave."

  - id: reached_cottage_porch_for_the_first_time
    type: location_enter
    location: "cottage_porch"
    conditions: ["!reached_cottage_porch"]
    effect: "reached_cottage_porch = true"
    message:
      en: |
        You're out. The cold night air hits you like a wall, and the wooden porch creaks under your feet.

        Now it is only you and your daughter. You remember the path that leads north, toward the fields. Beyond the crop fields there is a black castle where a nobleman is rumored to live.

        Maybe he could help. You have to get there. You have to find a way to survive.
      pt-br: |
        Você está fora. O ar frio da noite bate em você como uma parede, e a varanda de madeira range sob seus pés.

        Agora é só você e sua filha. Você se lembra do caminho que leva para o norte, em direção aos campos. Além dos campos cultivos há um castelo negro onde um nobre é conhecido por viver.

        Talvez ele possa ajudar. Você tem que chegar lá. Você tem que encontrar uma forma de sobreviver.

