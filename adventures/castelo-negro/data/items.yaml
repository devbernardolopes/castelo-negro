# All three item description patterns now work:
# Item format                     Example	                            desc.base desc.conditions Base text source
# {en, pt-br} (no conditions)     cottage_key	                        undefined falsy           _pickLang(desc) via line 624
# {en, pt-br, conditions}	        cottage_kitchen_table, husband_belt undefined truthy          _pickLang(desc) via line 614 fallback
# {base: {en, pt-br}, conditions} (locations)	                        truthy    truthy          _pickLang(desc.base) via line 614 primary

items:
  cottage_key:
    name: { en: "Cottage Key", pt-br: "Chave do Chalé" }
    synonyms: { en: ["brass key", "key", "cottage key"], pt-br: ["chave de latão", "chave", "chave do chalé"] }
    takeable: true
    size: 1
    description: { en: "A tarnished brass key.", pt-br: "Uma chave de latão oxidada." }
    images: ["images/items/tti-2026-05-23T23-26-04-394045010.png"]
    on_ground_messages:
      - condition: "husband_corpse_rolled"
        message: { en: "A tarnished brass key glints on the floor.", pt-br: "Uma chave de latão oxidada brilha no chão." }
      - condition: "true"
        message: { en: "A key lies on the ground.", pt-br: "Uma chave está no chão." }

  hand_sickle:
    name: { en: "Hand Sickle", pt-br: "Foice de Mão" }
    synonyms: { en: ["sickle", "reap hook", "reaping hook"], pt-br: ["foice", "foice de mão"] }
    takeable: true
    size: 1
    images: ["images/items/tti-2026-05-23T23-37-55-654889641.png"]
    description: { en: "A worn, curved sickle.", pt-br: "Uma foice desgastada e curvada." }
    on_ground_messages:
      - condition: "husband_corpse_rolled"
        message: { en: "A sickle lies on the floor, near the body.", pt-br: "Uma foice está no chão, perto do corpo." }
      - condition: "true"
        message: { en: "A sickle lies on the ground.", pt-br: "Uma foice está no chão." }

  husband_hand:
    name: { en: "Husband's Hand", pt-br: "Mão do Esposo" }
    synonyms: { en: ["hand", "husband's hand", "husband's grasp", "grasp"], pt-br: ["mão", "mão do marido"] }
    openable: true
    takeable: false
    container_capacity: 2
    contents: [hand_sickle]
    description:
      en: |
        The cold, stiff hand of your husband.
      pt-br: |
        A mão fria e rígida do seu marido.
      conditions:
        - if: "containerHas(husband_hand, hand_sickle) and !husband_hand_open"
          message: { en: "Your husband's hand is clenched tightly, but you can see the handle of a sickle protruding from his grasp.", pt-br: "A mão do seu marido está fechada com força, mas você pode ver o cabo de uma foice saindo de sua mão." }
        - if: "containerHas(husband_hand, hand_sickle) and husband_hand_open"
          message: { en: "Your husband's hand is now open, and you can see the handle of a sickle protruding from his grasp.", pt-br: "A mão do seu marido está aberta, e você pode ver o cabo de uma foice saindo de sua mão." }

  husband_corpse:
    name: { en: "Husband's Corpse", pt-br: "Cadáver do Esposo" }
    synonyms: { en: ["husband", "corpse", "body"], pt-br: ["marido", "cadáver", "corpo"] }
    takeable: false
    contents: [husband_belt, husband_hand]
    description:
      en: |
        The body of your husband, cold and still.
      pt-br: |
        O corpo do seu marido, frio e imóvel.
    contents_visibility:
      husband_belt:
        visible_when: "husband_belt_visible"
  
  husband_belt:
    name: { en: "Husband's Belt", pt-br: "Cinto do Esposo" }
    synonyms: { en: ["belt", "husband's belt"], pt-br: ["cinto", "cinto do marido"] }
    takeable: false
    wearable: true
    # droppable: true
    contents: [cottage_key]
    description: 
      en: |
        The belt of your husband, worn and torn.
      pt-br: |
        O cinto do seu marido, desgastado e rasgado.
      conditions:
        - if: "husband_corpse_rolled"
          message: { en: "You see a tarnished brass key tied to the back of the belt.", pt-br: "Você vê uma chave de latão oxidada amarrada na parte de trás do cinto." }
    contents_visibility:
      cottage_key:
        visible_when: "husband_corpse_rolled and husband_belt_visible"

  newborn_daughter:
    name: { en: "Newborn Daughter", pt-br: "Filha Recém-Nascida" }
    synonyms: { en: ["baby", "daughter", "infant", "newborn"], pt-br: ["bebê", "filha", "criança", "recém-nascida"] }
    takeable: true
    size: 8
    description: { en: "Your tiny, crying daughter.", pt-br: "Sua pequena filha chorando." }
    images: ["images/items/tti-2026-05-24T02-23-25-446674314.png"]

  cottage_kitchen_table:
    name: { en: "Kitchen Table", pt-br: "Mesa da Cozinha" }
    synonyms: { en: ["table", "kitchen table"], pt-br: ["mesa", "mesa da cozinha"] }
    takeable: false
    contents: [moldy_loaf_of_bread, leather_pouch]
    description:
      en: |
        A small, worn wooden table.
      pt-br: |
        Uma pequena mesa de madeira desgastada.
      conditions:
        - if: "containerHas(cottage_kitchen_table, moldy_loaf_of_bread)"
          message: { en: "A small, mold-covered loaf lies on the table.", pt-br: "Um pequeno pedaço de pão mofado está sobre a mesa." }
        - if: "containerHas(cottage_kitchen_table, leather_pouch)"
          message: { en: "A small leather pouch sits on the table.", pt-br: "Uma pequena bolsa de couro está sobre a mesa." }

  leather_pouch:
    name: { en: "Leather Pouch", pt-br: "Bolsa de Couro" }
    synonyms: { en: ["pouch", "leather pouch"], pt-br: ["bolsa", "bolsa de couro"] }
    takeable: true
    container_capacity: 3
    size: 1
    contents: []
    description:
      en: |
        A small leather pouch, empty and worn.
      pt-br: |
        Uma pequena bolsa de couro, vazia e desgastada.
    images: ["images/items/tti-2026-05-30T19-40-34-455370821.png"]

  stone_hearth:
    name: { en: "Stone Hearth", pt-br: "Lareira de Pedra" }
    synonyms: { en: ["hearth", "stone hearth"], pt-br: ["lareira", "lareira de pedra"] }
    takeable: false
    contents: [charred_wood, hearth_ashes]
    description:
      en: |
        A simple stone hearth for cooking and warmth.
      pt-br: |
        Uma lareira de pedra simples para cozinhar e aquecer.
      conditions:
        - if: "containerHas(stone_hearth, charred_wood) and containerHas(stone_hearth, hearth_ashes)"
          message: { en: "There are piles of ashes and charred wood in the hearth.", pt-br: "Há pilhas de cinzas e madeira queimada na lareira." }
        - if: "containerHas(stone_hearth, charred_wood) and !containerHas(stone_hearth, hearth_ashes)"
          message: { en: "There are pieces of charred wood in the hearth.", pt-br: "Há pedaços de madeira queimada na lareira." }
        - if: "!containerHas(stone_hearth, charred_wood) and containerHas(stone_hearth, hearth_ashes)"
          message: { en: "There are piles of ashes in the hearth.", pt-br: "Há pilhas de cinzas na lareira." }

  moldy_loaf_of_bread:
    name: { en: "Moldy Loaf of Bread", pt-br: "Pão Mofado" }
    synonyms: { en: ["bread", "loaf of bread", "moldy bread", "moldy loaf", "loaf of moldy bread", "loaf", "mold-covered loaf"], pt-br: ["pão", "pão mofado", "pedaço de pão mofado", "pedaço de pão"] }
    takeable: true
    consumable: true
    size: 2
    description: { en: "A small, mold-covered loaf.", pt-br: "Um pequeno pedaço de pão mofado." }
    images: ["images/items/tti-2026-05-23T23-26-32-610649206.png"]
    # on_ground_messages:
    #   - condition: "true"
    #     message: { en: "A moldy loaf of bread is on the ground.", pt-br: "Um pão mofado está no chão." }

  charred_wood:
    name: { en: "Charred Wood", pt-br: "Madeira Queimada" }
    synonyms: { en: ["charred wood", "wood"], pt-br: ["madeira queimada", "madeira"] }
    takeable: true
    size: 2
    description: { en: "A piece of wood that has been burned.", pt-br: "Um pedaço de madeira que foi queimado." }
    images: ["images/items/tti-2026-05-25T22-56-49-992411015.png"]
    on_ground_messages:
      - condition: "true"
        message: { en: "Some charred wood lies on the ground.", pt-br: "Pedaços de madeira queimada estão no chão." }
  
  hearth_ashes:
    name: { en: "Hearth Ashes", pt-br: "Cinzas da Lareira" }
    synonyms: { en: ["hearth ashes", "ashes"], pt-br: ["cinzas da lareira", "cinzas"] }
    takeable: true
    size: 1
    description: { en: "Piles of ashes from the stone hearth.", pt-br: "Pilhas de cinzas da lareira de pedra." }
    images: ["images/items/tti-2026-05-25T23-26-53-1025784771.png"]
    on_ground_messages:
      - condition: "true"
        message: { en: "A pile of ashes sits on the ground.", pt-br: "Uma pilha de cinzas está no chão." }

  cottage_front_door:
    name: { en: "Cottage Front Door", pt-br: "Porta da Frente do Chalé" }
    synonyms: { en: ["front door", "door"], pt-br: ["porta da frente", "porta"] }
    takeable: false
    description: { en: "The sturdy front door of your cottage.", pt-br: "A porta da frente do seu chalé." }

  cottage_living_room_walls:
    name: { en: "Living Room Walls", pt-br: "Paredes da Sala de Estar" }
    synonyms: { en: ["wooden walls", "wooden wall", "living room walls", "walls", "wall", "living room wall", "room walls", "room wall"], pt-br: ["paredes de madeira", "parede de madeira", "paredes da sala de estar", "paredes", "parede", "parede da sala de estar", "paredes da sala", "parede da sala"] }
    takeable: false
    description: { en: "The wooden walls of the living room.", pt-br: "As paredes de madeira da sala de estar." }

  cottage_living_room_left_window:
    name: { en: "Living Room Left Window", pt-br: "Janela Esquerda da Sala de Estar" }
    synonyms: { en: ["living room left window", "left window", "window", "windows"], pt-br: ["janela esquerda da sala de estar", "janela esquerda", "janela", "janelas"] }
    openable: true
    takeable: false
    description:
      en: |
        A small window on the left side of the living room.
      pt-br: |
        Uma pequena janela no lado esquerdo da sala de estar.
      conditions:
        - if: "cottage_living_room_left_window_open"
          message: { en: "The left window is open, letting in the cold winter air.", pt-br: "A janela esquerda está aberta, deixando entrar o ar frio do inverno." }
        - if: "!cottage_living_room_left_window_open"
          message: { en: "The left window is closed.", pt-br: "A janela esquerda está fechada." }

  cottage_living_room_right_window:
    name: { en: "Living Room Right Window", pt-br: "Janela Direita da Sala de Estar" }
    synonyms: { en: ["living room right window", "right window", "window", "windows"], pt-br: ["janela direita da sala de estar", "janela direita", "janela", "janelas"] }
    openable: true
    takeable: false
    description:
      en: |
        A small window on the right side of the living room.
      pt-br: |
        Uma pequena janela no lado direito da sala de estar.

  stream_ice:
    name: { en: "Thin Ice", pt-br: "Gelo Fino" }
    synonyms: { en: ["ice", "frozen surface", "stream ice", "thin ice"], pt-br: ["gelo", "superfície congelada", "gelo fino"] }
    takeable: false
    description:
      en: |
        The ice shimmers deceptively. One wrong step could mean disaster.
      pt-br: |
        O gelo brilha de forma enganosa. Um passo em falso poderia significar desastre.
