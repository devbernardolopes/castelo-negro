variables:
  game_turn:
    type: int
    value: 0
    description: "Increments every player action"

  invalid_attempt_count:
    type: int
    value: 0
    debug_variable: true
    description: "Number of consecutive invalid actions. Resets to 0 on valid action."

  current_player_actor:
    type: object
    value: [protagonist]

  protagonist_memory:
    type: list
    value: ["look", "take", "examine", "open", "unlock", "feed", "give", "go", "roll", "close", "lock", "use", "drop", "husband", "baby", "south", "door", "north"]

  protagonist_memory_max_capacity:
    type: int
    value: 100
    min_value: 0

  newborn_daughter_health:
    type: int
    value: 3
    min_value: 0
    max_value: 3

  cottage_door_open:
    type: bool
    value: false
    description: "If true, the front door of the cottage is open, otherwise it is closed. This variable does not determine whether the door is locked or unlocked, only whether it is currently open or closed."

  cottage_door_locked:
    type: bool
    value: true
    description: "If true, the front door of the cottage is locked and by extension closed."

  player_health:
    type: int
    value: 10
    min_value: 0
    max_value: 10

  sanity:
    type: int
    value: 8
    min_value: 0
    max_value: 10

  has_met_hag:
    type: bool
    value: false

  time_of_day:
    type: string
    value: "night"
    possible_values: ["night", "dawn", "morning", "afternoon", "evening"]

  fed_newborn_daughter: 
    type: bool
    value: false

  entered_castle:
    type: bool
    value: false

  # ---
  # COTTAGE KEY
  # ---
  cottage_key_discovery_stage:
    type: int
    value: 0
    description: "0=unknown, 1=husband_dead, 2=suspected_on_body, 3=belt_spotted, 4=belt_accessible, 5=key_obtained"
    min_value: 0
    max_value: 5
    debug_variable: true

  husband_corpse_inspected_count:
    type: int
    value: 0
    debug_variable: true
    description: "How many times the player has examined the corpse"

  husband_corpse_rolled:
    type: bool
    value: false
    debug_variable: true
    description: "Whether the player has rolled/flipped the corpse to access the belt back"

  husband_belt_visible:
    type: bool
    value: false
    debug_variable: true
    description: "Whether the belt is visible to the player"

  cottage_door_unlock_attempted:
    type: bool
    value: false
    debug_variable: true
    description: "True if player has tried to leave via locked door at least once"