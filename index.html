<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Adeventure Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game">
    <div id="menu-row">
      <button id="menu-btn-load-adventure" class="menu-btn" data-action="load-adventure" title="Load Adventure">Adventure</button>
      <button id="menu-btn-reset-game" class="menu-btn" data-action="reset-game" title="Reset Game">Reset</button>
      <button id="menu-btn-load-game" class="menu-btn" data-action="load-game" title="Load Game">Load</button>
      <button id="menu-btn-save-game" class="menu-btn" data-action="save-game" title="Save Game">Save</button>
      <button id="menu-btn-change-language" class="menu-btn" data-action="change-language" title="Change Language">Language</button>
    </div>
    <div id="adventure-title-row" aria-live="polite"></div>
    <div id="adventure-modal-backdrop" class="modal-backdrop" style="display:none;">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adventure-modal-title">
        <div class="modal-header">
          <div id="adventure-modal-title" class="modal-title">Load Adventure</div>
          <button id="adventure-modal-close" class="modal-close" title="Close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="mode-row">
            <label class="mode-option"><input type="radio" name="adventure-load-mode" value="web"> Web</label>
            <label class="mode-option"><input type="radio" name="adventure-load-mode" value="disk"> Disk</label>
          </div>

          <div id="adventure-web-pane" class="mode-pane">
            <div class="form-row">
              <label class="form-label" for="adventure-web-select">Adventure</label>
              <select id="adventure-web-select" class="form-control"></select>
            </div>
            <div class="hint" id="adventure-web-hint"></div>
            <div class="actions-row">
              <button id="adventure-web-load" class="menu-btn" type="button">Load</button>
            </div>
          </div>

          <div id="adventure-disk-pane" class="mode-pane" style="display:none;">
            <div class="hint">Select a YAML file. For images, you may be asked to pick the adventure folder.</div>
            <div class="actions-row">
              <button id="adventure-disk-load" class="menu-btn" type="button">Choose YAML…</button>
            </div>
            <div class="hint" id="adventure-disk-hint"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="top-row">
      <div id="room-image"><img id="room-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Room Image" style="max-width:100%;max-height:100%;display:none;"/></div>
      <div id="sidebar-tabs">
        <div class="tabs-header" role="tablist" aria-label="Sidebar">
          <button class="tab-btn" type="button" role="tab" aria-selected="true" aria-controls="tab-panel-mind" id="tab-mind" data-tab="mind">Mind</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="tab-panel-inventory" id="tab-inventory" data-tab="inventory">Inventory</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="tab-panel-memory" id="tab-memory" data-tab="memory">Memory</button>
        </div>
        <div class="tabs-body">
          <div class="tab-panel" role="tabpanel" id="tab-panel-mind" aria-labelledby="tab-mind">
            <h2>Mind</h2>
            <div id="mind-panel"></div>
          </div>
          <div class="tab-panel" role="tabpanel" id="tab-panel-inventory" aria-labelledby="tab-inventory" style="display:none;">
            <h2>Inventory</h2>
            <ul id="inventory-list"></ul>
          </div>
          <div class="tab-panel" role="tabpanel" id="tab-panel-memory" aria-labelledby="tab-memory" style="display:none;">
            <h2>Memory</h2>
            <div id="memory-list" role="list" aria-label="Memory words"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="text-display"></div>
    <div id="input-row">
      <div id="user-input" role="list" aria-label="Command builder"></div>
      <button id="input-btn-send" class="input-btn">Send</button>
      <div id="directional-buttons-row" class="directional-buttons">
        <div class="button-row">
          <button id="direction-btn-up" class="direction-btn" data-direction="up">↑</button>
        </div>
        <div class="button-row">
          <button id="direction-btn-left" class="direction-btn" data-direction="left">←</button>
          <button id="direction-btn-down" class="direction-btn" data-direction="down">↓</button>
          <button id="direction-btn-right" class="direction-btn" data-direction="right">→</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
