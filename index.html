<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Adeventure Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game">
    <div id="menu-row">
      <button id="menu-btn-load-adventure" class="menu-btn" data-action="load-adventure" title="Load Adventure">Adventure</button>
      <button id="menu-btn-reset-game" class="menu-btn" data-action="reset-game" title="Reset Game">Reset</button>
      <button id="menu-btn-load-game" class="menu-btn" data-action="load-game" title="Load Game">Load</button>
      <button id="menu-btn-save-game" class="menu-btn" data-action="save-game" title="Save Game">Save</button>
      <button id="menu-btn-change-language" class="menu-btn" data-action="change-language" title="Change Language">Language</button>
    </div>
    <div id="adventure-title-row" aria-live="polite"></div>
    <div id="top-row">
      <div id="room-image"><img id="room-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Room Image" style="max-width:100%;max-height:100%;display:none;"/></div>
      <div id="inventory">
        <h2>Inventory</h2>
        <ul id="inventory-list"></ul>
      </div>
    </div>
    <div id="text-display"></div>
<div id="input-row">
      <textarea id="user-input" rows="3" placeholder="What do you?"></textarea>
      <div class="directional-buttons">
        <div class="button-row">
          <button class="direction-btn" data-direction="up">↑</button>
        </div>
        <div class="button-row">
          <button class="direction-btn" data-direction="left">←</button>
          <button class="direction-btn" data-direction="down">↓</button>
          <button class="direction-btn" data-direction="right">→</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
